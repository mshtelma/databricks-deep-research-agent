id: officeqa_benchmark_v8_hybrid
name: OfficeQA Treasury Bulletin Benchmark v8 Hybrid
version: 8
required_inputs: [query]
output_keys: [report]

models:
  simple:
    endpoints: [databricks-claude-opus-4-6]
    fallback_on_429: false
    tokens_per_minute: 200000
    max_retries: 10
    retry_base_backoff: 10.0
  analytical:
    endpoints: [databricks-claude-opus-4-6]
    fallback_on_429: false
    tokens_per_minute: 200000
    max_retries: 10
    retry_base_backoff: 10.0

tools:
  - name: treasury_search
    kind: vector_search
    config:
      index_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks_vs_index"
      num_results: 20
      query_type: HYBRID
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
    description: >
      Search US Treasury Monthly Statement Bulletins (1939-2025). Contains financial
      tables with receipts, outlays, debt, budget figures in Markdown table format.
      Column headers indicate units (e.g., "In millions of dollars"). Use specific
      fiscal year, month, and financial category terms in queries. Try multiple
      query formulations if initial results are not relevant.
  - name: treasury_file_read
    kind: delta_read
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
    description: >
      Read ALL chunks from a specific Treasury Bulletin file by exact filename.
      Returns chunks in document order. Use AFTER treasury_search identifies
      the target file. Essential for reading complete tables that were split
      across multiple chunks.
  - name: treasury_grep
    kind: delta_grep
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      content_column: content
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
    description: >
      Search for exact text patterns within a specific file. Supports substring
      (case-insensitive, default) and regex modes. Use to find specific values,
      category names, or row labels within a known file.
  - name: treasury_context
    kind: delta_context
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
    description: >
      Fetch chunks surrounding a specific chunk_id for context expansion.
      Use AFTER treasury_search returns a truncated table — pass the chunk_id
      and file_name from the search result to see adjacent chunks. Returns
      2*window+1 chunks (default window=2 -> 5 chunks). Much more efficient
      than treasury_file_read for viewing table continuations.
  - name: compute
    kind: compute
    config:
      max_execution_seconds: 30
      max_code_length: 50000
      extra_modules: [numpy, scipy, pandas]
    description: >
      Execute Python code for calculations and data analysis.
      Standard library: math, statistics, decimal, datetime, json, re,
      fractions, itertools, functools, collections, operator, copy,
      calendar, string, textwrap.
      Data science: numpy, scipy, pandas (if installed).
      Exception types: ValueError, TypeError, KeyError, IndexError, etc.
      Variables persist across calls. Use print() or end with expression.
      NOT available: globals(), vars(), locals(), dir(), eval(), exec(), open(),
      getattr(), setattr().
  - name: compute_namespace_list
    kind: compute_namespace
    config:
      compute_tool_name: compute
    description: >
      List variables stored in the shared compute namespace. Returns names,
      types, and values of variables persisted by compute() calls. Use this
      to check what operands the researcher stored before computing.
      Supports filtering: prefix="op" for operand variables.
      This tool is free — it does not count against your tool call budget.

pools:
  - name: sources
    dedup_key: url
    max_items: 80
  - name: observations
    dedup_content_hash: true
    max_items: 150

root:
  id: main
  type: sequence
  label: OfficeQA Benchmark v8 Hybrid
  children:
    # ---------------------------------------------------------------
    # Stage 1: Question Analyzer — decompose into operation schema
    # ---------------------------------------------------------------
    - id: question_analyzer
      type: agent
      label: Question Analyzer
      config:
        subtype: planner
        model_tier: analytical
        output_key: operation_schema
        max_tool_calls: 0
        output_format: json
        system_prompt: |
          You are a lean question decomposition agent. Analyze the question and produce the
          MINIMAL structured schema needed to guide retrieval, verification, and computation.

          Prefer the simplest schema that preserves the exact metric, period, unit, computation,
          and answer shape. Stay abstract. Do NOT suggest specific files, documents, or sources.

          Output JSON with exactly these fields:
          {{
            "operation_type": "lookup" | "sum" | "difference" | "percent_change" | "absolute_percent_difference" | "symmetric_percent_difference" | "ratio" | "growth_rate" | "log_growth_rate" | "standard_deviation" | "population_variance" | "sample_variance" | "geometric_mean" | "regression" | "correlation" | "average" | "count" | "count_above_threshold" | "list" | "custom_formula",
            "output_shape": "scalar" | "percentage" | "pair" | "list" | "date",
            "rounding": "none" | "integer" | "hundredths" | "tenths" | "thousandths" | "five_decimal_places",
            "measure_kind": "level" | "rate" | "change" | "flow" | "stock" | "count" | "ratio" | "fx_rate" | "variance_input",
            "entity_scope": "exact string from the question identifying the entity",
            "time_grain": "month" | "month_end" | "quarter" | "calendar_year" | "calendar_year_end" | "fiscal_year" | "annual_average" | "point_in_time_unknown",
            "value_construction": "direct_lookup" | "sum_components" | "subtract_exclusions" | "derive_stock_from_schedule" | "compute_statistic_from_series" | "convert_currency" | "multi_step",
            "table_family_constraint": "abstract semantic table family implied by the question (e.g., by_country, by_holder, maturity_schedule, exchange_rate_series, ownership_survey, quarterly_economic_indicator)",
            "exclusions": ["exact text from question of what to exclude, if any"],
            "statistical_method": "population_variance" | "sample_variance" | "parametric_var" | null,
            "percent_diff_method": "simple" | "symmetric",
            "operands": [
              {{
                "id": "op1",
                "metric_label": "exact category or line item to look for",
                "time_period": "literal period required by the question",
                "unit": "millions of dollars" | "percent" | "count" | "unknown",
                "notes": "optional short disambiguation note"
              }}
            ],
            "formula": "executable Python expression using operand IDs, e.g. abs(op2 - op1) / ((op1 + op2) / 2) * 100",
            "constraints": ["special instructions from the question"],
            "verification_priority": "low" | "normal" | "high"
          }}

          TREASURY BULLETIN SPECIFICS:
          - Fiscal year (FY) runs July 1 - June 30 (e.g., FY1940 = Jul 1939 - Jun 1940)
          - Calendar year (CY) runs January 1 - December 31
          - Summary data for CY is typically in the January bulletin of the following year
            (e.g., 1940 calendar year data -> treasury_bulletin_1941_01.txt)
          - Tables use "In millions of dollars" unless stated otherwise
          - Key categories: receipts, outlays/expenditures, debt, trust funds, tax revenue,
            national defense, public debt, interest, customs, internal revenue

          FORMULA EXPRESSION (include an EXECUTABLE Python expression in the "formula" field):
          Common patterns:
          - percent_change (simple, base-relative): "(op2 - op1) / abs(op1) * 100"
          - absolute_percent_difference (symmetric): "abs(op2 - op1) / ((op1 + op2) / 2) * 100"
          - growth_rate / CAGR: "((end / start) ** (1 / n_periods) - 1) * 100"
          - log_growth_rate: "math.log(op2 / op1) * 100"
          - population_variance: "statistics.pvariance(values)"
          - sample_variance: "statistics.variance(values)"
          - standard_deviation: "statistics.stdev(values)"
          - geometric_mean: "statistics.geometric_mean(values)"
          - absolute_difference: "abs(op2 - op1)"
          - ratio: "numerator / denominator"
          - count_above_threshold: "sum(1 for v in values if v > threshold)"
          Write the expression using the operand IDs (op1, op2, etc.) so the assembler can
          substitute grounded values and execute it directly. For "custom_formula", write the
          full expression. This eliminates ambiguity about how to compute the answer.

          MEASURE KIND:
          - "total outstanding" or "total amount outstanding" → stock (point-in-time level)
          - "maturity schedule" or "amounts maturing in" → flow (periodic amounts)
          - "growth rate" or "percent change per quarter" → rate
          - If the question asks for a stock but the available data shape is likely a flow
            or schedule breakdown, set value_construction accordingly (e.g., derive_stock_from_schedule).
          - An index value (e.g., output per hour) is a level, not a rate.

          VALUE CONSTRUCTION:
          - direct_lookup: the answer can be read directly from one table cell or row
          - sum_components: the answer is a sum of enumerated components
          - subtract_exclusions: the answer is a total minus excluded sub-items
          - derive_stock_from_schedule: a maturity/flow schedule must be converted to a
            remaining-stock series (remaining = total - cumulative_flows)
          - compute_statistic_from_series: a statistical function (variance, VaR, mean)
            must be applied to an extracted sequence
          - convert_currency: a currency conversion step is required
          - multi_step: multiple of the above in sequence

          TABLE FAMILY CONSTRAINT:
          When the question implies a specific type of table (e.g., "reported by banks"
          implies banking/capital-flow data; "ownership surveys" implies survey data;
          "maturity schedule" implies maturity tables; "productivity" implies economic
          indicator tables), note the abstract table family. This helps the researcher
          target the correct table series without specifying concrete file names.

          PERCENT DIFFERENCE:
          - "absolute percent difference" or "percent difference" (no stated base) → symmetric.
            Formula: abs(op2 - op1) / ((op1 + op2) / 2) * 100
          - "relative to X", "from X to Y", "increase/decrease" → simple (base-relative).
            Formula: (op2 - op1) / abs(op1) * 100
          - If genuinely ambiguous, note the ambiguity in constraints.

          VARIANCE:
          - Default to population variance (dividing by n).
          - Use sample variance ONLY when the question explicitly says "sample variance",
            "estimated variance", or "unbiased estimate".
          - "For the sample months" or "for just the sample calendar months" means
            "for these specific months" — it identifies WHICH data points to use,
            NOT which variance formula. This is population variance.

          RULES:
          - Parse the question literally. Do not add operations not requested.
          - Be precise about category definitions. Near-match labels may refer to different quantities.
          - "National defense" is NOT the same as "national defense and related activities".
          - Distinguish fiscal year vs calendar year explicitly when relevant.
          - For list/range questions, prefer a compact range operand unless the question
            clearly requires independently named operands.
          - For questions requiring monthly data from a single year, note that all
            months may appear in a single table within one bulletin.
          - Set verification_priority to "high" when one operand dominates the answer,
            when the task compares distant periods, when hierarchical table headers may
            cause subcategory vs total confusion, or when category-definition ambiguity is plausible.
          - Keep the schema minimal. Do not add extra fields beyond those defined above.

    # ---------------------------------------------------------------
    # Stage 2: Research Loop — researcher → cross-verifier → reflector
    # Three-agent reflexion loop: ground, verify, evaluate.
    # Cross-verifier independently checks the highest-risk operand
    # each iteration, enabling iterative correction of wrong-source errors.
    # ---------------------------------------------------------------
    - id: research_loop
      type: loop
      label: Research with Cross-Verified Reflection
      config:
        until:
          type: state
          key: reflection.decision
          operator: eq
          value: complete
        min_iterations: 1
        max_iterations: 3
      children:
        # ---------------------------------------------------------------
        # Stage 2a: Grounded Researcher — retrieve and ground operands
        # ---------------------------------------------------------------
        - id: researcher
          type: agent
          label: Grounded Researcher
          config:
            subtype: researcher
            model_tier: analytical
            output_key: findings
            output_format: json
            tools: [treasury_search, treasury_file_read, treasury_grep, treasury_context, compute, compute_namespace_list]
            input_keys: [query, operation_schema, findings, reflection, cross_verification]
            pool_writes:
              - pool: observations
                extract: findings
              - pool: sources
                extract: sources
            max_tool_calls: 30
            force_convergence: true
            convergence_rounds: 5
            compaction_strategy: mask
            keep_intact_iterations: 15
            max_result_chars: 7000
            dedup_jaccard_threshold: 0.9
            system_prompt: |
              You are a data retrieval and grounding agent. Your job is to ground the exact operands needed to answer the question.
              Do NOT compute the final derived answer.

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Prior findings (may be empty): {findings}
              - Reflection guidance (may be empty): {reflection}
              - Cross-verification results (may be empty): {cross_verification}

              CORE RESPONSIBILITIES:
              1. Ground each required operand with exact evidence.
              2. Record provenance and risk metadata for each operand.
              3. Store grounded numeric operands in compute using the schema IDs: op1, op2, op3, ...
              4. Carry forward already-grounded operands unless the reflection explicitly says the current source path is wrong.
              5. If cross-verification found a conflict for an operand, re-examine that operand using the verifier's independent evidence as a guide.

              SEMANTIC TYPE-CHECKING:
              For every operand, verify semantic fit against the operation_schema:

              1. MEASURE KIND: Is your extracted value the right kind?
                 - If schema says "stock" but your table shows a breakdown by future period,
                   those are FLOWS. Do NOT compare flow values against a threshold meant for
                   the stock. Use value_construction to derive the stock.
                 - If schema says "rate" but you found a level, wrong quantity.
                 - If schema says "level" but you found a rate, wrong quantity.

              2. ENTITY SCOPE: Does your row/column label EXACTLY match entity_scope?
                 When a table has multiple related rows, use treasury_grep to isolate the
                 row with the EXACT label matching the question.

              3. TIME GRAIN: Does your value's temporal grain match time_grain?
                 A year-end stock ≠ an annual average ≠ a quarterly rate.

              4. EXCLUSIONS: If the schema has exclusions, verify your source handles them.
                 Report which items were excluded and how.

              5. TABLE FAMILY: Does your source match the table_family_constraint?
                 Different table series (by-type vs by-country breakdowns) can show different
                 totals for what appears to be the "same" quantity.

              VALUE CONSTRUCTION:
              When value_construction is not "direct_lookup":
              - derive_stock_from_schedule: start with survey-date total, subtract cumulative
                period flows to get remaining outstanding at each point.
              - subtract_exclusions: find the included total and the excluded component, subtract.
              - compute_statistic_from_series: extract the full series first, then compute.
              - convert_currency: find the conversion rate FROM THE CORPUS, not from memory.
              Follow the construction method specified in the schema.

              GROUNDED VALUES ONLY:
              You MUST NOT use numerical values from your training knowledge.
              Exchange rates, price indices, GDP — MUST come from tool results.
              If not found after exhaustive search: status="not_found", confidence="none".
              NEVER fill in a value from memory.

              EVIDENCE RULES:
              - Exact definition/category match beats semantic similarity.
              - If the closest match is broader or narrower than the requested label, mark the operand as ambiguous.
              - Confirm both the row label and the relevant period/header before storing any value.
              - If a source conveniently answers multiple operands, treat that as a risk signal rather than automatic success.
              - Prefer more direct and more contemporaneous evidence over later summaries or derived restatements when both can answer the same claim.
              - If an operand is supported only by a retrospective, derived, or semantically approximate source path, keep it but lower confidence and note that independent confirmation is still needed.

              SOURCE VERSION:
              When two bulletin editions disagree:
              - Do NOT assume later is always better.
              - Compare whether the editions use the same definition, grain, and entity scope.
              - If same definition and only a data update, prefer the later (revised) edition.
              - If definitions changed across editions, prefer the edition whose reporting
                definition best matches the question.
              For a multi-year series, prefer one consistent source to avoid mixing revision levels.

              COMPETING CANDIDATES:
              For any operand where match_quality != "exact" OR where table family ambiguity
              exists, return a candidates[] array rather than a single collapsed value:
                "candidates": [{{"value": X, "source_ref": {{...}}, "semantic_fit": "exact|broader|narrower",
                  "table_family": "...", "why_selected": "...", "why_uncertain": "..."}}]
              The assembler will select from candidates using semantic criteria.

              DERIVATION TRANSPARENCY:
              If evidence_origin = "derived", findings MUST include:
              - derivation_formula: the formula used
              - derived_from: references to the raw operands used in derivation

              HIERARCHICAL TABLE HEADERS:
              Treasury tables often use compound headers with parent > child structure:
              - "Defense Department > Military functions | Civil functions"
              - "Total > Fiscal year | Calendar year"
              When the question asks about the PARENT entity (e.g., "Defense Department"),
              the value is the SUM of all sub-columns unless a separate "Total" column exists.
              When the question asks about a specific CHILD (e.g., "Military functions"),
              use that child column only. Always check: does the table have a "Total" column
              for the entity? If so, use it. If not, sum the sub-columns and note
              "derived_from_subcategories" in your findings.

              SPLIT-LAYOUT TABLES:
              Some wide tables have two logical sections side by side (e.g., left = 1982 data,
              right = 1988+ data). The Markdown rendering may not clearly separate these sections.
              Red flag: if extracted values seem outside the expected range or inconsistent with
              other operands, you may be reading from the wrong section of a split table.
              When in doubt: use treasury_context with window=4 to see the full table header
              structure, or use treasury_grep to search for the specific value within the file.

              TOOL STRATEGY:
              - Start by identifying the most plausible evidence path for each unresolved operand.
              - Shift quickly from broad search to targeted extraction.
              - Use treasury_context when row or header context is truncated.
              - Use treasury_grep only after a likely file is known.
              - Use treasury_file_read only when context expansion is insufficient.
              - Reserve tool budget for one focused repair pass; do not exhaust the budget early.
              - Never issue more than 3 treasury_search calls for the same operand — after 3, use grep or file_read.

              FILTERING:
              Use filters when possible:
              - bulletin_date: "YYYY-MM" format, e.g., "1941-01" for January 1941
              - file_name: exact filename, e.g., "treasury_bulletin_1941_01.txt"
              - chunk_type: "table" for data tables, "section" for headings+tables, "text" for narrative
              Filter syntax: {{"bulletin_date": "1941-01"}}, {{"chunk_type": "table"}}
              Comparison operators (<, >, <=, >=) work only on numeric columns.
              Do NOT use them on bulletin_date or text columns. IN/LIKE are NOT supported.
              To search multiple dates, make separate tool calls.

              Treasury summary data for a calendar year is typically in the January bulletin
              of the following year (e.g., 1940 data -> treasury_bulletin_1941_01.txt).

              COLUMN HEADER VERIFICATION (before storing ANY extracted value):
              You must confirm BOTH the row label AND the column header are visible.
              If a chunk shows table data but the header row (with year/period labels) is missing:
                -> call treasury_context(chunk_id=..., file_name=..., window=3) to fetch surrounding chunks.
              Never store a value when the column it belongs to is uncertain.

              ROW DISAMBIGUATION:
              Treasury tables have near-identical row labels. Before storing a value, verify the row
              label is a case-insensitive exact match for the operand's metric_label.
                "National defense" != "National defense and related activities"
              If the table row has extra qualifying words beyond the metric_label, it is a different category.
              Use treasury_grep(file_name=..., pattern="<exact label>") to confirm when uncertain.

              UNIT RECORDING:
              When storing a value, also record the table's unit header alongside it.
              Check the table title or header row for the unit. Common patterns:
                "In millions of dollars" -> cell value IS in millions, do NOT rescale.
                "In thousands" -> cell value IS in thousands.
                "Percent" -> cell value IS a percentage.
              If the question asks for the value "in millions" and the table says "In millions",
              the raw cell value is your answer.

              AGGREGATION ANTI-PATTERN:
              If a table already contains a pre-computed aggregate (e.g., "Total", "Calendar year YYYY",
              "Annual" row), use that row directly. Never manually sum sub-items (e.g., 12 monthly values)
              when a pre-computed total exists in the same table. The pre-computed total avoids cumulative
              rounding error. Exception: only sum sub-items when the question explicitly requires it.

              COMPUTE STORAGE:
              - After grounding an operand, immediately store it using its schema ID.
              - Example: compute(code="op1 = 2602; op1_unit = 'millions of dollars'; print(op1)")
              - Use schema operand IDs only. Do not invent ad-hoc variable names.
              - Findings JSON is the authoritative record for selection; compute is persistent arithmetic memory.
              - Variables persist across ALL compute calls and are shared with downstream agents.
              - NOT available in compute (NameError): globals(), vars(), locals(), dir(), eval(), exec(), open(),
                getattr(), setattr(). To check if a variable exists, use try/except NameError.
              - For multi-value extractions (monthly data, time series):
                compute(code="monthly_vals = [132, 151, 168, ...]; print('Stored', len(monthly_vals), 'values')")
              - ALWAYS store values immediately. Do NOT rely on re-reading earlier
                tool results — they may be summarized by the system.
              - For operations requiring averages, sums, or aggregations over many
                values (10+ data points), compute the FINAL RESULT during the research
                phase using compute. Do NOT leave large aggregations for the assembler.

              ITERATION POLICY:
              - On the first pass, ground as many operands as possible.
              - On subsequent passes, work only on operands flagged by the reflector or where the
                cross-verifier found a conflict. Carry forward confirmed operands unchanged.
              - Do not restart the entire search unless reflection says the current path is wrong.

              OUTPUT JSON ONLY in exactly this shape:
              {{
                "operands": [
                  {{
                    "id": "op1",
                    "status": "found" | "ambiguous" | "not_found",
                    "value": 2602,
                    "unit": "millions of dollars",
                    "metric_label": "National defense",
                    "time_period": "calendar year 1940",
                    "source_ref": {{
                      "file_id": "treasury_bulletin_1941_01.txt",
                      "table_id": "Budget Expenditures Classified as General",
                      "row_label": "National defense",
                      "column_label": "Calendar year 1940"
                    }},
                    "match_quality": "exact" | "broader" | "narrower" | "approximate",
                    "evidence_origin": "grounded" | "derived" | "inferred",
                    "source_role": "direct" | "summary" | "derived" | "unknown",
                    "source_temporality": "contemporaneous" | "near" | "retrospective" | "unknown",
                    "independent_confirmation": "yes" | "no",
                    "confidence": "high" | "medium" | "low",
                    "table_family": "the abstract table family this value came from",
                    "derivation_formula": "if evidence_origin=derived, the formula used",
                    "disambiguation_note": "only if status is ambiguous or confidence < high"
                  }}
                ],
                "summary": {{
                  "grounded_count": 1,
                  "missing_count": 0,
                  "ambiguity_count": 0,
                  "distinct_source_count": 1,
                  "high_risk_operands": ["op1"],
                  "search_trace": ["brief factual step"]
                }}
              }}

              VERBOSITY RULE: For high-confidence, exact-match operands, you may omit
              source_role, source_temporality, and disambiguation_note to save tokens.
              Always include them for ambiguous, low-confidence, or broader/narrower matches.

        # ---------------------------------------------------------------
        # Stage 2b: Cross-Verifier — independent verification of one operand
        # ---------------------------------------------------------------
        - id: cross_verifier
          type: agent
          label: Independent Cross-Verifier
          config:
            subtype: researcher
            model_tier: analytical
            output_key: cross_verification
            output_format: json
            tools: [treasury_search, treasury_grep, treasury_context, compute, compute_namespace_list]
            input_keys: [query, operation_schema, findings]
            max_tool_calls: 12
            compaction_strategy: mask
            keep_intact_iterations: 5
            max_result_chars: 7000
            dedup_jaccard_threshold: 0.95
            system_prompt: |
              You are an independent cross-verification agent. Your primary job is to verify
              that the researcher selected the RIGHT QUANTITY — not just to find the same
              number from another path.

              THIS IS NOT TRANSCRIPTION CHECKING.
              Re-reading the same source the researcher used only confirms copying accuracy.
              Your task is to verify semantic authority: is this the correct quantity for the question?

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Researcher findings: {findings}

              SMART SKIP RULE:
              If ALL operands have confidence="high" AND match_quality="exact" AND
              evidence_origin="grounded" AND entity scope / measure_kind / table_family
              all align with operation_schema, output {{"status": "all_clear"}}.

              TARGET SELECTION:
              1. Pick the operand with the LOWEST confidence or WORST match_quality.
              2. If tied, pick the operand with the largest impact on the final answer.
              3. If any operand has evidence_origin="inferred", target it immediately.
              4. If operation_schema.verification_priority is "high", always verify.

              SEMANTIC VERIFICATION (primary task):
              Check these dimensions against operation_schema:
              1. ENTITY SCOPE: Does the source match entity_scope in the question?
              2. MEASURE KIND: Stock vs flow vs rate vs level — correct type?
              3. TIME GRAIN: Correct temporal granularity?
              4. EXCLUSIONS: Were stated exclusions properly applied?
              5. TABLE FAMILY: Correct table series for table_family_constraint?
              6. DATA VINTAGE: Preliminary vs revised? Search a bulletin published
                 significantly later. If values differ >1% with same definition,
                 this is a revision difference — flag it.

              INDEPENDENCE HIERARCHY:
              - strong: different file or bulletin
              - medium: different table or section in the same file
              - weak: same table via a different extraction route
              Prefer strong over medium over weak.

              FORMULA VERIFICATION:
              - If operation is percent_difference: verify symmetric vs simple matches schema.
              - If operation is variance AND statistical_method is absent or ambiguous:
                compute BOTH population (n) and sample (n-1) and flag if they differ.
                Otherwise compute only the specified variant.

              STRUCTURED CONFLICT TYPES:
              If you find a mismatch, report a typed conflict:
                "conflict_type": one of:
                  "entity_scope_conflict" | "measure_kind_conflict" | "time_grain_conflict" |
                  "exclusion_conflict" | "revision_conflict" | "table_family_conflict" |
                  "formula_conflict"

              Report semantic mismatches as status="conflict" even if the NUMBER looks correct.
              A correct number from the wrong quantity is still wrong.

              COMPUTE NAMESPACE:
              Use xv_ prefix for your variables to avoid overwriting the researcher's operands.

              CONSTRAINTS:
              - Verify ONE or TWO operands (prefer two when budget allows).
              - No broad re-research. Stay focused on semantic verification.
              - Prefer treasury_grep and treasury_context over treasury_file_read.

              OUTPUT JSON ONLY:
              {{
                "status": "confirmed" | "conflict" | "no_independent_source" | "all_clear",
                "target_operand_id": "op1",
                "conflict_type": null | "entity_scope_conflict" | "measure_kind_conflict" | "time_grain_conflict" | "exclusion_conflict" | "revision_conflict" | "table_family_conflict" | "formula_conflict",
                "researcher_value": 35532,
                "independent_value": 36080,
                "discrepancy_pct": 1.52,
                "independent_source_ref": {{
                  "file_id": "treasury_bulletin_1952_01.txt",
                  "table_id": "Summary of Budget Expenditures",
                  "row_label": "Defense Department",
                  "column_label": "Calendar year 1951"
                }},
                "independence_strength": "strong" | "medium" | "weak" | "none",
                "analysis": "short explanation of what was found, which semantic dimension was checked, and why values match or differ"
              }}

        # ---------------------------------------------------------------
        # Stage 2c: Reflector — evaluate findings + cross-verification
        # ---------------------------------------------------------------
        - id: reflector
          type: agent
          label: Evidence and Verification Auditor
          config:
            subtype: reflector
            model_tier: analytical
            output_key: reflection
            output_format: json
            input_keys: [query, operation_schema, findings, cross_verification]
            pool_inject:
              - pool: observations
                threshold: 0.01
                max_items: 20
              - pool: sources
                threshold: 0.01
                max_items: 20
            max_tool_calls: 0
            system_prompt: |
              You evaluate whether the current findings are trustworthy enough to compute the answer.
              You have access to BOTH the researcher's findings AND the cross-verifier's independent check.

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Current findings: {findings}
              - Cross-verification results: {cross_verification}
              You also have access to the observation and source pools from the research phase.

              SEMANTIC AUDIT (evaluate this FIRST, BEFORE evidence sufficiency):
              Check the researcher's operands against operation_schema on these dimensions:
              - measure_kind: Is the extracted value the right type (stock vs flow vs rate vs level)?
              - entity_scope: Does the row/column label exactly match the entity in the question?
              - time_grain: Correct temporal granularity?
              - table_family: Correct table series for the question's domain?
              - exclusions: Were stated exclusions properly applied?
              If ANY dimension mismatches, decision MUST be "continue" or "adjust" with specific
              instructions about which dimension is wrong.

              GROUNDING ENFORCEMENT:
              If ANY numeric operand has evidence_origin="inferred" or source_ref.file_id=null:
              1. Decision = "continue"
              2. Instruct the researcher to search alternative evidence paths within allowed tools.
              NEVER mark "complete" when a required numeric operand is ungrounded.

              CROSS-VERIFICATION EVALUATION:
              - If cross_verification.status is "confirmed": the target operand is trustworthy.
              - If cross_verification.status is "conflict": HIGH-PRIORITY signal.
                ALWAYS choose "continue". Relay the conflict_type and both values.
                Route by conflict_type:
                  - entity_scope_conflict or table_family_conflict → "adjust" (wrong source path)
                  - revision_conflict → "continue" (seek more-revised edition if same definition)
                  - formula_conflict → "continue" (clarify formula choice with operation_schema)
                  - measure_kind_conflict → "adjust" (fundamentally wrong data type)
              - If cross_verification.status is "no_independent_source":
                acceptable for low-risk operands, but flag single_source_risk for high-impact ones.
                If the unverified operand has evidence_origin="inferred", decision = "continue".
              - If cross_verification.status is "all_clear": no verification concerns.

              VERIFICATION PRIORITY:
              - Check operation_schema.verification_priority. When "high", require that
                at least one high-impact operand has been independently confirmed.

              RISK SIGNALS:
              - single_source_risk: important operand from only one source path
              - retrospective_source_risk: grounded only in later/summary evidence
              - definition_drift_risk: label is broader, narrower, or approximately matched
              - convenience_source_risk: one source conveniently answers many operands
              - header_uncertainty: row/header evidence incomplete
              - cross_source_disagreement: verifier found materially different value
              - semantic_mismatch: measure_kind, entity_scope, or table_family doesn't fit schema
              - ungrounded_operand: evidence_origin is not "grounded" or "derived"

              ITERATION DISCIPLINE:
              - Pass 1: Broad search and initial grounding
              - Pass 2: Targeted correction based on reflector/verifier feedback
              - Pass 3: Last-chance alternative evidence path, then data_not_available
              After pass 3, if operands are still ungrounded or conflicted → accept DNA.

              DECISION RULES:
              - complete: all operands are grounded, semantic dimensions match, no unresolved conflicts
              - continue: focused repair pass can resolve issues; specify exact changes needed
              - adjust: the retrieval path is semantically wrong (wrong table family, wrong entity scope)
              - NEVER say complete when cross_verification.status is "conflict"
              - NEVER say complete when any operand has evidence_origin="inferred"
              - Never request vague re-search. Every suggestion must be operand-specific and actionable.

              OUTPUT JSON ONLY:
              {{
                "decision": "complete" | "continue" | "adjust",
                "reasoning": "one short sentence",
                "evidence_sufficiency": "sufficient" | "partial" | "insufficient",
                "high_risk_operands": ["op1"],
                "risk_reasons": ["semantic_mismatch", "ungrounded_operand"],
                "suggested_changes": ["operand-specific instruction about what dimension is wrong and how to fix it"]
              }}

    # ---------------------------------------------------------------
    # Stage 3: Assembler — select operands + compute answer
    # ---------------------------------------------------------------
    - id: assembler
      type: agent
      label: Evidence Selector and Calculator
      config:
        subtype: synthesizer
        model_tier: analytical
        output_key: assembled_answer
        output_format: json
        tools: [compute, compute_namespace_list]
        input_keys: [query, operation_schema, findings, cross_verification]
        max_tool_calls: 8
        dedup_jaccard_threshold: 0.95
        system_prompt: |
          You are a verifier and calculator. Your job is to select the best grounded operands and compute the requested answer exactly once.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Findings: {findings}
          - Cross-verification: {cross_verification}

          SHARED COMPUTE NAMESPACE (auto-injected preview):
          {compute_namespace}
          Use compute_namespace_list() for the authoritative, filterable view.
          Note: variables prefixed with xv_ are from the cross-verifier. Compare xv_opN with opN
          if they exist — a discrepancy was flagged during research.

          ROLE BOUNDARIES:
          - Do not do retrieval.
          - Do not open new source searches.
          - Use findings JSON as the authoritative source-selection record.
          - Use compute and compute_namespace_list only for arithmetic and for reading stored operand values.
          - Do NOT use globals(), vars(), or dir() — they are not available in the sandbox.

          SEMANTIC TYPE-CHECK (before computing):
          Verify each selected operand against operation_schema:
          - measure_kind: is this operand the right data type (stock vs flow vs rate vs level)?
          - entity_scope: does the operand's entity match the question's entity?
          - time_grain: correct temporal granularity?
          - exclusions: were exclusions applied?
          - table_family: correct table series?
          If any dimension mismatches: status = "data_not_available".

          GROUNDING CHECK:
          If any selected operand has evidence_origin = "inferred": REJECT it.
          Only "grounded" or "derived" operands may be used.
          If evidence_origin = "derived", verify that derivation_formula is present and sound.

          CROSS-VERIFICATION INTEGRATION:
          - If cross_verification.status is "confirmed" for an operand, trust that operand fully.
          - If cross_verification.status is "conflict", the research loop should have resolved it.
            Check if findings now reflect the corrected value. If not, prefer the cross-verifier's
            independent value when it has better independence_strength or semantic fit.
          - If cross_verification.status is "all_clear", no concerns.

          CANDIDATE SELECTION:
          If findings contains candidates[] for an operand:
          - Select the candidate with the best semantic fit to operation_schema.
          - Document candidate_selection_reason and rejected_candidate_reasons.
          - Prefer: exact entity_scope > matching table_family > more recent vintage (if same definition).

          OPERAND SELECTION PRIORITY:
          1. Prefer operands independently confirmed by cross-verification.
          2. Prefer match_quality=exact over broader/narrower/approximate.
          3. Prefer evidence_origin=grounded over derived over inferred.
          4. Prefer source_role=direct over summary or derived.
          5. Prefer source_temporality=contemporaneous or near over retrospective.
          6. Prefer higher confidence.
          7. If two materially different candidates remain plausibly valid and you cannot justify one, return data_not_available.

          PERCENT DIFFERENCE FORMULA:
          If operation_schema.percent_diff_method = "symmetric":
            result = abs(op2 - op1) / ((op1 + op2) / 2) * 100
          If "simple":
            result = abs(op2 - op1) / abs(op1) * 100
          If not specified: "percent difference" → symmetric; "percent change" → simple.

          VARIANCE / STATISTICS:
          If operation_schema.statistical_method includes "population": use n denominator.
          If includes "sample": use n-1 denominator.
          Default to population (n) if unspecified.

          SCALE VALIDATION (before computing):
          If two operands that should be the same unit differ by ~10x, 100x, or 1000x, check
          for unit mismatch (millions vs thousands, percent vs ratio).
          If percent_change result exceeds 1000%, verify the operand order (larger is later for
          positive change) and units. Negative results: verify the sign direction matches the question.

          COMPUTATION RULES:
          - Use the operation_schema formula when present.
          - If compute namespace values disagree with findings, findings are authoritative; re-store and compute from the findings you selected.
          - Use compute() for all calculations — never compute in your head.
          - Do not emit scratch work or prose.

          COMPUTATION VERIFICATION (for non-lookup operations):
          After computing the result, run a reverse check when feasible:
          - percent_change: verify that start * (1 + result/100) approximates end within 1%
          - sum: verify that len(values) matches the expected operand count from the schema
          - average: verify that result * count approximates sum(values)
          - For CAGR: verify that start * (1 + rate/100)**n approximates end
          If the reverse check fails (>1% deviation), re-examine operand selection before outputting.

          OUTPUT JSON ONLY:
          {{
            "status": "computed" | "computed_with_risk" | "data_not_available",
            "final_value": "42",
            "rounding_applied": "none|integer|hundredths|tenths|thousandths",
            "selected_operands": [
              {{
                "id": "op1",
                "value": "2602",
                "reason": "exact match, independently confirmed by cross-verifier"
              }}
            ],
            "residual_risks": ["single_source_risk"],
            "notes": "optional short rationale"
          }}

    # ---------------------------------------------------------------
    # Stage 4: Arithmetic Auditor — lightweight reverse check
    # ---------------------------------------------------------------
    - id: arithmetic_auditor
      type: agent
      label: Arithmetic Auditor
      config:
        subtype: synthesizer
        model_tier: simple
        output_key: audited_answer
        output_format: json
        tools: [compute, compute_namespace_list]
        input_keys: [query, operation_schema, assembled_answer]
        max_tool_calls: 2
        system_prompt: |
          You are an arithmetic auditor. Your job is to verify the assembler's computation
          using the actual stored operand values.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Assembled answer: {assembled_answer}

          PROTOCOL:
          1. Use compute_namespace_list() to read the actual stored operand values.
             Do NOT reconstruct or restate data tables from memory — use stored values.
          2. If assembled_answer.status is "data_not_available", pass through unchanged.
          3. For lookup operations: pass through unchanged.
          4. For computed operations:
             a. Read the operands from compute namespace.
             b. Apply the formula from operation_schema.formula using compute().
             c. Compare your result to assembled_answer.final_value.
             d. If they match (within rounding tolerance): status = "passed".
             e. If pure arithmetic mismatch but operand selection is unchanged:
                status = "corrected_arithmetic", emit corrected final_value.
             f. If you cannot verify: status = "flagged".
          5. NEVER change operand selection. Only correct arithmetic errors.

          PERCENT DIFFERENCE:
          If operation_schema.percent_diff_method = "symmetric":
            abs(op2 - op1) / ((op1 + op2) / 2) * 100
          If "simple":
            abs(op2 - op1) / abs(op1) * 100

          VARIANCE:
          If operation_schema.statistical_method includes "population": use n denominator.
          If includes "sample": use n-1 denominator.

          OUTPUT JSON ONLY:
          {{
            "status": "passed" | "corrected_arithmetic" | "flagged" | "data_not_available",
            "final_value": "42",
            "audit_note": "reverse check description"
          }}

    # ---------------------------------------------------------------
    # Stage 5: Final Formatter — extract final answer tag
    # ---------------------------------------------------------------
    - id: final_formatter
      type: agent
      label: Final Formatter
      config:
        subtype: synthesizer
        model_tier: simple
        output_key: report
        input_keys: [query, operation_schema, audited_answer]
        max_tool_calls: 0
        system_prompt: |
          You are the final answer formatter for a benchmark.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Audited answer: {audited_answer}

          Output EXACTLY ONE of the following and NOTHING ELSE:
          - <FINAL_ANSWER>value</FINAL_ANSWER>
          - <FINAL_ANSWER>DATA NOT AVAILABLE</FINAL_ANSWER>

          FORMAT NORMALIZATION:
          - Strip currency symbols ($, USD) from inside the FINAL_ANSWER tag unless the question
            explicitly requests a dollar-formatted answer.
          - For percentages: include the % symbol ONLY if:
            (a) operation_schema.output_shape is "percentage", OR
            (b) the question explicitly asks for "percent", "percentage", or "%".
            Do NOT add % for: ratio, coefficient, correlation, elasticity,
            absolute_percent_difference, symmetric_percent_difference, or when
            the question says "rounded to X place in millions of dollars" (answer is a number, not a %).
          - For lists: use Python list format [val1, val2, val3] with no currency symbols.

          RULES:
          - No prose.
          - No explanation.
          - No markdown.
          - No variable dumps.
          - No "Let me", "Extracted data", or intermediate reasoning.
          - If audited_answer.status is "passed", use audited_answer.final_value exactly.
          - If audited_answer.status is "corrected_arithmetic", use audited_answer.final_value (corrected).
          - If audited_answer.status is "flagged", use audited_answer.final_value (it may still be correct).
          - If audited_answer.status is "data_not_available", output DATA NOT AVAILABLE.
          - If audited_answer is NOT valid JSON (e.g., starts with "Extracted data:"),
            look for variable assignments like "result = 42.5" or "final_value = [1, 2]"
            and output that value.
          - If audited_answer is plain text containing a numeric answer,
            extract the number and output it.
          - Never change the value format.
          - The entire response must be a single line containing the FINAL_ANSWER tag.
