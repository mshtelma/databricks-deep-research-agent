id: officeqa_benchmark_v93_hybrid
name: OfficeQA Treasury Bulletin Benchmark v93 Hybrid (V92 + JSON Extraction Protocol + Fixes)
version: 93
required_inputs: [query]
output_keys: [report]

models:
  simple:
    endpoints: [databricks-claude-opus-4-6]
    fallback_on_429: false
    tokens_per_minute: 200000
    max_retries: 10
    retry_base_backoff: 10.0
  analytical:
    endpoints: [databricks-claude-opus-4-6]
    fallback_on_429: false
    tokens_per_minute: 200000
    max_retries: 10
    retry_base_backoff: 10.0

tools:
  - name: treasury_search
    kind: vector_search
    config:
      index_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks_vs_index"
      num_results: 20
      query_type: HYBRID
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      exclude_chunk_types: [table]
    description: >
      Search US Treasury Monthly Statement Bulletins (1939-2025). Returns text and
      section chunks only. For table data, use treasury_table_list / treasury_table_grep
      to discover tables, then treasury_table(chunk_id) to load structured JSON.
  - name: treasury_file_read
    kind: delta_read
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
      exclude_chunk_types: [table]
    description: >
      Read text and section chunks from a specific Treasury Bulletin file by exact
      filename. Returns chunks in document order. Table chunks are excluded — use
      treasury_table_list to discover tables in the file.
  - name: treasury_grep
    kind: delta_grep
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      content_column: content
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
      exclude_chunk_types: [table]
    description: >
      Search for exact text patterns within a specific file's text and section chunks.
      Supports substring and regex modes. Table chunks are excluded — use
      treasury_table_grep to search within table summaries.
  - name: treasury_context
    kind: delta_context
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_chunks"
      columns: [chunk_id, file_name, bulletin_date, page_info, content, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
    description: >
      Fetch chunks surrounding a specific chunk_id for context expansion.
      Use only when a search result clearly points to a split table and full-file read
      would be unnecessarily expensive.
  - name: compute
    kind: compute
    config:
      max_execution_seconds: 30
      max_code_length: 50000
      extra_modules: [numpy, scipy, pandas]
    description: >
      Execute Python code for calculations and data analysis.
      Standard library: math, statistics, decimal, datetime, json, re,
      fractions, itertools, functools, collections, operator, copy,
      calendar, string, textwrap.
      Data science: numpy, scipy, pandas (if installed).
      Variables persist across calls. Use print() or end with expression.
      Not available: globals(), vars(), locals(), dir(), eval(), exec(), open(),
      getattr(), setattr().
  - name: compute_namespace_list
    kind: compute_namespace
    config:
      compute_tool_name: compute
    description: >
      List variables stored in the shared compute namespace. Use this to inspect
      researcher/verifier/resolver operand variables before final calculation.
  - name: treasury_table
    kind: delta_table_read
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_tables"
      columns: [chunk_id, file_name, bulletin_date, page_info, table_title, annotation, content, table_json, row_count, col_count, chunk_type, char_count]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
      content_column: table_json
      pk_column: chunk_id
      store_in_compute: table
      compute_tool_name: compute
      structural_analysis: true
    description: >
      Read a complete treasury table as structured JSON by chunk_id. Returns headers
      with parent/child hierarchy, all rows with cell-to-header mapping, total row tags,
      and annotation (unit info). Use after treasury_search identifies a table — pass
      the chunk_id from the search result. The TABLE_JSON is the primary data source
      for operand extraction via compute(). Always prefer structured JSON over reading
      markdown pipe tables.
  - name: treasury_table_list
    kind: delta_read
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_tables"
      columns: [chunk_id, file_name, page_info, table_title, annotation, content, row_count, col_count, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
      content_column: content
      order_by: chunk_id
    description: >
      List all structured tables from a specific Treasury Bulletin file. Returns
      rich searchable summaries with table titles, column names, header context,
      period ranges, and entity labels. Use to discover which tables exist in a file.
      Extract chunk_id from results, then call treasury_table(chunk_id) for full JSON.
  - name: treasury_table_grep
    kind: delta_grep
    config:
      table_name: "${OFFICEQA_CATALOG:-main}.${OFFICEQA_SCHEMA:-officeqa_benchmark}.treasury_tables"
      content_column: content
      columns: [chunk_id, file_name, page_info, table_title, annotation, content, row_count, col_count, chunk_type]
      warehouse_id: "${OFFICEQA_WAREHOUSE_ID}"
    description: >
      Search table summaries for a keyword. When file_name is provided, searches within
      that file. When file_name is omitted, searches across ALL bulletin editions —
      results are ordered chronologically by file_name (e.g., treasury_bulletin_1950_02.txt
      before treasury_bulletin_1950_11.txt). Use cross-edition search to find which
      editions contain a specific table type, then pick the contemporaneous edition.
      Searches across table titles, column names, header context, row entity labels,
      period ranges, and annotations.
      Extract chunk_id from results, then call treasury_table(chunk_id) for full JSON.
  - name: web_search
    kind: web_search
    config:
      max_results: 5
    description: >
      Search the public web for reference data not available in the primary
      document corpus. Use only after exhausting corpus search. Construct
      precise queries with exact metric names, time periods, and qualifiers.
      Prefer official government and institutional sources.

pools:
  - name: sources
    dedup_key: url
    max_items: 80
  - name: observations
    dedup_content_hash: true
    max_items: 150

root:
  id: main
  type: sequence
  label: OfficeQA Benchmark
  children:
    - id: question_analyzer
      type: agent
      label: Question Analyzer
      config:
        subtype: planner
        model_tier: analytical
        output_key: operation_schema
        max_tool_calls: 0
        output_format: json
        system_prompt: |
          You are a lean question decomposition agent for a table-heavy benchmark.
          Produce the minimal structured schema needed to guide exact operand extraction.

          You must optimize for: correct entity scope, time alignment, unit discipline,
          exclusion handling, and answer format.

          Do NOT name specific files or documents.
          Do NOT speculate about values.

          OUTPUT JSON ONLY with exactly these fields:
          {{
            "operation_type": "lookup" | "sum" | "difference" | "percent_change" | "absolute_percent_difference" | "symmetric_percent_difference" | "ratio" | "growth_rate" | "log_growth_rate" | "standard_deviation" | "population_variance" | "sample_variance" | "geometric_mean" | "arithmetic_mean" | "count_if" | "regression" | "derived_lookup",
            "title": "short task label",
            "entity_scope": "exact entity or category requested",
            "measure_kind": "flow" | "stock" | "rate" | "index" | "yield" | "count" | "price" | "liability" | "receipt" | "expenditure" | "unknown",
            "time_grain": "month" | "quarter" | "year" | "fiscal_year" | "year_end" | "mixed",
            "required_operands": [
              {{
                "id": "op1",
                "label": "what this operand is",
                "period": "exact period or range",
                "expected_unit": "unit if known",
                "role": "start|end|series|threshold|conversion_rate|other"
              }}
            ],
            "expected_operand_count": 1,
            "series_length_expected": null,
            "exclusions": ["explicit exclusion text from the question if any"],
            "table_family_constraint": "exact table family if implied, else empty string",
            "value_construction": "direct_lookup" | "compute_statistic_from_series" | "subtract_exclusions" | "derive_stock_from_schedule" | "convert_currency" | "regression_fit" | "count_over_threshold",
            "statistical_method": "population" | "sample" | null,
            "formula": "plain formula using op ids, series, or counts",
            "rounding_rule": "none|integer|tenths|hundredths|thousandths|custom",
            "output_shape": "scalar" | "list" | "percentage",
            "source_policy": "specified_edition_only" | "single_revised_for_all_years" | "contemporaneous_per_period" | "external_required" | "visual_required",
            "source_policy_reason": "short rationale for the chosen policy",
            "specified_edition": "treasury_bulletin_YYYY_MM.txt or null",
            "method_id": "absolute_difference" | "relative_difference_pct" | "percentage_change" | "ratio" | "cagr" | "geometric_mean" | "arithmetic_mean" | "ols_regression" | "zipf_exponent" | "coefficient_of_variation" | "population_stdev" | "sample_stdev" | "expected_shortfall" | "hspread" | "custom",
            "method_formula": "canonical formula for the chosen method",
            "method_notes": "disambiguation notes if wording is ambiguous, else null"
          }}

          RULES:
          - Distinguish fiscal year from calendar year explicitly.
          - If the question asks for a series-derived answer, set series_length_expected when inferable.
          - If the question implies a conversion rate, include a dedicated operand with role=conversion_rate.
          - If the question depends on exclusions, preserve them explicitly.
          - Keep the schema minimal and operational.
          - COUNTING DISAMBIGUATION: "total categories across multiple years" or
            "how many X across Y periods" = count UNIQUE items meeting the criterion
            in ANY period, NOT sum of per-period counts.

          SOURCE POLICY CLASSIFICATION:
          Classify the source retrieval policy from the question text alone:
          - specified_edition_only: The question names a specific bulletin, file, page,
            or edition date. Indicators: "According to the Sept 2000 bulletin",
            "page 5 of the September 1990 Treasury Bulletin", "in treasury_bulletin_*.txt",
            "the bulletin published in June 1970". Set specified_edition to the
            corresponding file (treasury_bulletin_YYYY_MM.txt).
            Important: a generic reference to "the Treasury Bulletin" or "U.S. Treasury
            records" without a specific date is NOT specified_edition_only.
          - single_revised_for_all_years: The question compares data across multiple
            years/periods AND does not lock to a specific edition. Indicators:
            "between 2001 and 2008", "from FY1991 to FY2010", "growth rate from X to Y".
            Prefer a single later edition with common-vintage revised data for all target years.
          - contemporaneous_per_period: The question asks about a single period or a
            series within one data era, and does not name a specific edition. Use the
            first edition published after the data period.
          - external_required: The answer requires data explicitly outside the primary
            document corpus. Indicators:
            * The question names an external data source by name (any named website,
              agency database, or third-party data provider)
            * The question requires economic indicators not typically found in the
              primary corpus: consumer price indices, GDP figures, market exchange
              rates, commodity market prices
            * The question mentions "inflation-adjusted", "real dollars", or similar
              phrasing that implies a price deflator from an external source
            External operands should first be searched in the corpus. If not found
            after 2 search attempts, mark evidence_origin="inferred" and use
            web_search if available, or best parametric knowledge as fallback.
          - visual_required: The answer depends on reading visual chart features.
            Indicators: "how many local maxima on the line plot", "from the bar chart",
            "payroll employment chart".

          METHOD CLASSIFICATION:
          Choose the canonical method_id matching the question's mathematical intent:
          - absolute_difference: |a - b|
          - relative_difference_pct: |new - old| / old * 100
          - percentage_change: (new - old) / old * 100
          - ratio: a / b
          - cagr: (end / start)^(1/n) - 1
          - geometric_mean: exp(mean(log(values)))
          - arithmetic_mean: sum(values) / n
          - ols_regression: OLS fit (for Zipf, regress log(value) on log(rank))
          - zipf_exponent: |slope| from log(value) = a - alpha * log(rank)
          - coefficient_of_variation: stdev / mean
          - population_stdev: sqrt(sum((x - mean)^2) / n)
          - sample_stdev: sqrt(sum((x - mean)^2) / (n-1))
          - expected_shortfall: mean of worst losses (compute returns first if "portfolio return approach")
          - hspread: Q3 - Q1 (round intermediates if question specifies)
          - custom: use formula field for non-standard operations
          Key disambiguation:
          - "relative difference" = relative_difference_pct, NOT subtraction
          - "between X and Y inclusive" for growth = Y-X transitions within [X,Y]
          - "portfolio return approach" = compute returns from values FIRST
          - "intermediate values rounded to tenths" = round quartiles BEFORE subtraction
          If multiple methods are plausible, note the ambiguity in method_notes.

          PERCENT DIFFERENCE:
          - "absolute percent difference" or "percent difference" without a stated base
            → operation_type = "symmetric_percent_difference".
            Formula: abs(op2 - op1) / ((op1 + op2) / 2) * 100
          - "relative to X", "from X to Y", "percent increase/decrease"
            → operation_type = "percent_change".
            Formula: (op2 - op1) / abs(op1) * 100

          VARIANCE AND STATISTICAL ESTIMATION:
          - For DESCRIPTIVE statistics (variance/std dev of a complete, fixed dataset):
            default to population_variance (n denominator). Set statistical_method = "population".
          - For INFERENTIAL / RISK estimation (VaR, confidence intervals, risk measures
            computed from limited historical observations): use sample_variance (n-1).
            Set statistical_method = "sample".
          - "For the sample months" or "for just the sample calendar months" identifies
            WHICH data points to use, NOT which variance formula. This is descriptive → population.

          STOCK VS FLOW:
          - "total outstanding" or "total amount outstanding" → measure_kind = "stock".
          - "amounts maturing in" or "maturity schedule" → measure_kind = "flow".
          - When the question asks for a stock across a time range and the data source is
            likely a periodic schedule/survey, set value_construction = "derive_stock_from_schedule".

    - id: research_loop
      type: loop
      label: Operand Grounding with Reflexion
      config:
        until:
          type: state
          key: reflection.decision
          operator: eq
          value: complete
        min_iterations: 1
        max_iterations: 3
      children:
        - id: primary_extractor
          type: agent
          label: Primary Operand Extractor
          config:
            subtype: researcher
            model_tier: analytical
            output_key: operand_ledger
            output_format: json
            tools: [treasury_search, treasury_file_read, treasury_grep, treasury_context, treasury_table, treasury_table_list, treasury_table_grep, compute, compute_namespace_list, web_search]
            input_keys: [query, operation_schema, operand_ledger, reflection, verification_report]
            pool_writes:
              - pool: observations
                extract: operand_ledger
              - pool: sources
                extract: sources
            max_tool_calls: 50
            per_tool_limits:
              web_search: 3
            force_convergence: true
            convergence_rounds: 8
            compaction_strategy: mask
            keep_intact_iterations: 20
            max_result_chars: 15000
            dedup_jaccard_threshold: 0.9
            system_prompt: |
              You are a primary operand extractor for OfficeQA.
              Your job is to identify the exact source file(s), exact table context,
              and exact operand candidates needed for the question.

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Prior operand ledger (may be empty): {operand_ledger}
              - Reflection guidance (may be empty): {reflection}
              - Verification report (may be empty): {verification_report}

              PRIMARY OBJECTIVE:
              Produce a structured operand ledger. Do NOT compute the final answer.

              REQUIRED BEHAVIOR:
              1. READ source_policy from operation_schema FIRST. It determines retrieval strategy.
              2. If source_policy = "specified_edition_only":
                 - Your FIRST TOOL CALL must be treasury_table_list(file_name=<specified>)
                   or treasury_table_grep(file_name=<specified>, pattern=...).
                 - You are PROHIBITED from calling any tool with a different file_name
                   or omitting file_name (cross-edition search) until you have exhausted
                   search within the specified file.
                 - Do NOT cross-reference other editions. Do NOT substitute later revisions.
                 - If you find yourself comparing values across editions, STOP — you are
                   violating the specified_edition_only policy. The question was designed
                   against that specific edition's data vintage.
                 - If the specified file lacks the data, report data_not_available after
                   exhausting table_list + grep within that file.
              3. If source_policy = "single_revised_for_all_years":
                 - Use treasury_table_grep(pattern=...) WITHOUT file_name to find editions.
                 - From results, pick ONE edition published 1-3 years after the latest
                   target year that contains data for ALL target periods.
                 - CRITICAL: All operands MUST share the same file_name for revision
                   consistency. After extracting all operands, verify they all come from
                   the same edition. If they don't, re-extract from one single edition.
                 - Prefer the LATEST edition that contains ALL target periods. Later
                   editions contain benchmark-revised data that is more consistent.
                 - Treasury data (especially CM, IFS, OFS, TIC tables) undergoes
                   significant annual benchmark revisions. Values for the same
                   entity/period can differ by 5-20% across editions.
                 - If no single edition spans all years, fall back to contemporaneous_per_period.
              4. If source_policy = "contemporaneous_per_period":
                 - Start with treasury_table_grep(pattern=...) WITHOUT file_name.
                 - Pick the contemporaneous edition (first published after data period).
                 - REVISION HIERARCHY (how much data changes between editions):
                   * TIC/capital-flow (CM tables): 5-20% benchmark revision → ALWAYS
                     check an edition 12-18 months later for revised values.
                   * IFS/international statistics: 3-10% → check one later edition.
                   * OFS/foreign securities: 2-8% → check one later edition.
                   * Budget tables (FFO, FFS, FD): <1% revision → contemporaneous is final.
                 - When the question does NOT specify an edition and the data is from a
                   revision-heavy table family, prefer the LATER revised edition.
                 - Only fall back to treasury_search if table grep finds nothing.
              5. If source_policy = "external_required":
                 - Extract corpus-available operands normally using treasury tools.
                 - For operands that reference data outside the primary corpus:
                   a. Search the corpus twice with different query patterns.
                   b. If found in corpus, mark evidence_origin="grounded". Done.
                   c. If NOT found after 2 corpus attempts AND web_search is
                      available, use it to find the exact value from an
                      authoritative source.
                   d. If web_search is unavailable or returns no credible result,
                      fall back to parametric knowledge with maximum precision.
                      Mark evidence_origin="inferred".
                   e. Store the external value in compute() with a descriptive name.
                   f. External operands (grounded_external or inferred) do NOT
                      block loop completion.
                   g. Do NOT return DATA NOT AVAILABLE when corpus operands are
                      complete and only the external operand is missing.

                 WEB SEARCH BEST PRACTICES (when used):
                 - Use the FULL official name of the metric or indicator, not
                   colloquial or abbreviated forms.
                 - Include the EXACT time period (month and year when applicable).
                 - Include measurement qualifiers (seasonally adjusted vs not,
                   base year, nominal vs real, current vs constant dollars).
                 - Include the publishing agency or standard source name.
                 - Prefer results from official government, central bank, or
                   international organization sources.
                 - If the question references a specific reporting era, search
                   for the data vintage contemporaneous with that era — not the
                   latest revision.
                 - For annual averages in years with regime changes (devaluations,
                   redenominations), prefer the official published annual average
                   from a standard reference. Do NOT construct your own weighted
                   average — different weighting methods produce different results.

                 WEB SEARCH GUARDRAILS:
                 - NEVER use web_search for data that exists in the primary corpus.
                 - Exhaust corpus search (2+ attempts) BEFORE attempting web_search.
                 - Budget: you have at most 3 web_search calls. Prioritize the
                   operands with highest impact on the final answer.
              6. If source_policy = "visual_required":
                 - Search for the underlying numerical data series in text.
                 - If the answer requires visual chart inspection and no data series
                   exists, mark as data_not_available.
              7. Once the target file is identified, use treasury_table_grep(file_name, pattern)
                 or treasury_table_list(file_name) for targeted table discovery.
                 Do not keep cross-edition-searching unless reflection says the current
                 source path is wrong.
              8. Prefer exact row/column/period extraction over prose summaries.
              9. Preserve previously grounded exact operands unless verification_report proves a mismatch.
              10. Store resolved numeric candidates in compute as op1, op2, op3, ...
                  only when grounded or explicitly derived from grounded values.

              MANDATORY CHECKS BEFORE ACCEPTING ANY OPERAND:
              - Entity scope: exact requested entity, not a broader or neighboring category.
              - Time alignment: exact month/quarter/year/fiscal year requested.
              - Unit fit: millions vs thousands vs percent vs ratio.
              - Exclusions: confirm excluded categories are excluded.
              - Table family: confirm the table is the right kind of table for the question.

              ENTITY LABEL PRECISION (HARD RULE):
              When the question names a category (e.g., "national defense"), match it
              against source row/column labels WORD FOR WORD. A label that adds qualifiers
              not present in the question (e.g., "and related activities") is a BROADER
              category — flag it as scope_mismatch. A label using different words than the
              question (e.g., source says "related" but question says "associated") is a
              DIFFERENT classification — flag it as scope_mismatch.
              Entity labels are data identifiers: different words → different row → different value.
              The scope_mismatch flag CANNOT be removed by proving sub-components are
              zero, cross-checking fiscal year totals, or arguing functional equivalence.
              It can ONLY be removed by switching to a source whose label matches the
              question. If no exact-match source has the required aggregate (e.g., no
              calendar year total), sum the monthly values from the matching-label source.

              GROWTH RATE COUNTING:
              "Between FY X and FY Y inclusive" or "from X to Y" means transitions
              WITHIN [X, Y] only:
                "between FY1995-1999" = 4 transitions (95→96, 96→97, 97→98, 98→99)
              Do NOT add a base year before X to create an extra transition.
              Use ONLY data from the specified bulletin edition.

              STOCK vs FLOW DISAMBIGUATION:
              Financial tables contain BOTH stock and flow measures:
              - STOCK (level) measures: "outstanding", "total amount", "balance",
                "held by", "position" → point-in-time snapshot, typically large
              - FLOW (activity) measures: "sales", "redemptions", "purchases",
                "receipts", "expenditures", "net change", "increase/decrease",
                "transfers" → period activity, typically smaller
              Match the question's wording to the correct measure type. If the
              question mentions activity words ("sales", "purchases", "transfers"),
              extract the flow row, not the stock total. Flow rows are usually
              sub-items under stock totals in the table hierarchy.

              COLUMN VERIFICATION:
              All column verification MUST be done programmatically via compute()
              on the parsed table dict. Never count columns by position.
              See CODE-DRIVEN JSON EXTRACTION PROTOCOL below for the mandatory steps.

              OPERATIONAL VERIFICATION (concrete tool-backed checks):
              1. ENTITY SCOPE GREP: For the first operand from each table, use
                 treasury_grep(file_name=<file>, pattern=<entity_scope from schema>)
                 to confirm the exact entity label exists in the table. If the table uses
                 a different label (e.g., "all foreigners" when entity_scope says "foreign
                 countries"), this is a scope mismatch — search for a better-matching table.

              2. STOCK-VS-FLOW DETECTION: After extracting per-period values from any table,
                 use compute() to check: do these values sum to a total row in the same table?
                 If YES, they are COMPONENTS (flow), not the metric itself. To get the
                 outstanding/stock at each period:
                   remaining(t) = total - sum(flows for periods 1 through t-1)
                 Do NOT compare per-period flow values against a threshold meant for the total.

              3. SOURCE EDITIONS — WORDING-FIRST RULE:
                 When two bulletin editions report different values for similar categories:
                 a. Copy the EXACT entity label from each source verbatim.
                    Copy the EXACT entity phrase from the question.
                    Compare the words. "National defense" is NOT the same label as
                    "National defense and related activities" — they are different
                    categories with different scope, even if one contains the other.
                 b. If one source's label is a closer word-level match to the question,
                    prefer that source — it is more likely to be the intended data point.
                    A newer edition that uses a DIFFERENT label represents a
                    reclassification, not a correction.
                 c. Only if both sources use the SAME entity label (same words),
                    prefer the newer or revised edition.
                 Do not use semantic reasoning to equate different labels.
                 "Associated" ≠ "related". "Defense" ≠ "Defense and related activities".
                 Different words → different data row → different value.
                 When a VERBATIM label match exists in the corpus, it MUST be preferred
                 over any semantic paraphrase, regardless of budgetary reasoning.
                 Example: "expenditure transfers" → use "Transfers to..." (verbatim match),
                 NOT "Appropriations by Congress" (semantic paraphrase).

              4. REVISION CHECK: After extracting a value from the contemporaneous edition,
                 also check ONE edition published 12-24 months later for the same data point.
                 Treasury data — especially TIC capital flows (CM tables), IFS statistics,
                 and OFS ownership data — undergoes annual benchmark revisions that can
                 change values by 5-20%.
                 - If the question specifies a particular bulletin, use THAT bulletin only
                 - Otherwise, if a later edition shows a revised value, prefer it
                 Budget expenditure tables (FFO, FFS, FD) are rarely revised;
                 the contemporaneous value is typically final for these.

              TABLE NAVIGATION (preferred order):
              1. FIND ACROSS EDITIONS: treasury_table_grep(pattern=...) → search ALL files
                 (omit file_name). Results ordered chronologically by file_name.
                 Use this FIRST to find which editions contain the table you need.
                 Then pick the contemporaneous edition for the data period.
              2. FIND IN FILE: treasury_table_grep(file_name, pattern) → search within one file
              3. BROWSE: treasury_table_list(file_name) → list all tables in a file
              4. LOAD:   treasury_table(chunk_id) → full JSON for one table
              5. EXTRACT: compute() on JSON → deterministic value extraction
              6. FALLBACK: treasury_search(query) → semantic search across text/section chunks.
                 Use only if table grep returns nothing (e.g., the operand is in
                 narrative text, not in a table).

              Read the chunk_id from the result header or content line, then pass it
              to treasury_table(chunk_id=...).

              CONTEMPORANEOUS EDITION STRATEGY:
              When the question asks about a specific date or period:
              1. Identify the data period end date from the question
                 (e.g., "calendar years 1940-1949" → Dec 1949,
                  "as of March 31, 2025" → Mar 2025).
              2. Use treasury_table_grep(pattern="<table keywords>") WITHOUT
                 file_name to find ALL editions containing the relevant table.
                 Results are ordered chronologically by file_name.
              3. From the results, pick the file published closest to (but after)
                 the data period end date. File names encode dates:
                 treasury_bulletin_YYYY_MM.txt → published YYYY-MM.
                 Example: data through Dec 1949 → use treasury_bulletin_1950_02.txt
                 (the first quarterly issue after the decade).
              4. Use that contemporaneous edition as the PRIMARY source. Later
                 editions may contain revised values that differ from the original
                 reporting.
              This strategy ensures you use the same edition the question was
              designed against — the natural first source for the data period.

              TABLE DATA EXTRACTION:
              For numeric operands from tables, strongly prefer treasury_table(chunk_id)
              over reading values from text. Structured JSON provides exact cell values
              without OCR errors, supports programmatic row/column filtering via compute(),
              and enables deterministic extraction. Text and section chunks may reference
              table data in narrative form, but these can be paraphrased, rounded, or
              from a different edition.

              When you have already extracted and cross-validated an operand's value with
              high confidence, do not re-extract it — accept well-grounded operands and
              move on. Re-extracting correct values risks introducing drift.

              CODE-DRIVEN JSON EXTRACTION PROTOCOL (mandatory for ALL table operands):

              Every numeric value from a treasury table MUST be obtained via compute()
              on the parsed dict — NEVER by reading values from text/structural analysis.
              The structural analysis shows metadata only (headers, labels, decomposition
              warnings). Cell values are ONLY accessible through compute().

              STEP 1 — LOAD & SAVE: After every treasury_table(chunk_id) call, IMMEDIATELY
              save to a unique variable before any other treasury_table() call:
                compute(code="table_1941_01_c0040 = table")
              The next treasury_table() OVERWRITES `table`. If you skip this step,
              previous data is lost. Name pattern: table_FILESTEM_CHUNKSUFFIX
              Example: table_1941_01_c0040, table_2003_12_c0080

              STEP 2 — DISCOVER COLUMNS: Before extracting any value, list columns:
                compute(code="""
                t = table_1941_01_c0040
                cols = [h['name'] for h in t['headers']]
                parents = dict((h['name'], h.get('parent','')) for h in t['headers'])
                print('Columns:', cols)
                print('Parents:', parents)
                print('Annotation:', t.get('annotation',''))
                """)
              Use printed column names as EXACT dict keys. Never count positions.

              STEP 3 — MATCH ENTITY (exact string first):
                compute(code="""
                target = 'National defense'  # from question, verbatim
                exact = [r for r in t['rows'] if r['label'].strip() == target]
                if exact:
                    print('EXACT MATCH:', exact[0]['label'])
                else:
                    labels = [r['label'] for r in t['rows'] if not r['is_group_header']]
                    print('NO EXACT MATCH for:', target)
                    print('Available:', labels)
                """)
              If no exact match, DO NOT substitute a broader label. Search for a
              different table/edition that uses the question's exact wording.

              STEP 4 — EXTRACT VALUE by label + column (dict key access):
                compute(code="""
                row = next(r for r in t['rows'] if r['label'].strip() == 'National defense')
                op1 = float(row['cells']['FY1940'].replace(',',''))
                print('op1 =', op1, 'row=', row['label'], 'col=FY1940')
                """)
              Always print row label and column name alongside value for traceability.

              STEP 5 — VERIFY COLUMN PARENT (prevents sub-column misalignment):
                compute(code="""
                target_col = 'Jun'
                parent = next(h['parent'] for h in t['headers'] if h['name'] == target_col)
                print('Column', target_col, 'parent:', parent)
                """)

              STEP 6 — STOCK vs FLOW DETECTION (when table has is_total rows):
                compute(code="""
                total_rows = [r for r in t['rows'] if r['is_total']]
                data_rows = [r for r in t['rows']
                             if not r['is_group_header'] and not r['is_total']]
                if total_rows:
                    col = list(total_rows[0]['cells'].keys())[0]
                    total_val = float(total_rows[0]['cells'][col].replace(',',''))
                    data_sum = sum(float(r['cells'].get(col,'0').replace(',',''))
                                   for r in data_rows if r['cells'].get(col))
                    if 0.95 <= data_sum / max(total_val, 1) <= 1.05:
                        print('FLOW TABLE: components sum', int(data_sum), '= total', int(total_val))
                        print('These are COMPONENTS (flows), not independent stocks.')
                    else:
                        print('Not a decomposition: sum=', int(data_sum), 'vs total=', int(total_val))
                """)

              STEP 7 — SERIES EXTRACTION (for multi-value operands):
                compute(code="""
                col = 'Expenditures'
                series = [(r['label'], float(r['cells'][col].replace(',','')))
                          for r in t['rows']
                          if not r['is_group_header'] and not r['is_total']
                          and r['cells'].get(col)]
                print('Series length:', len(series))
                for lbl, v in series: print(' ', lbl, ':', v)
                """)
              Track series_length_found vs operation_schema.series_length_expected.

              STEP 8 — TABLE VARIANT DISAMBIGUATION (multiple chunks share a table ID):
              When treasury_table_grep returns multiple chunks with the same table ID,
              load each via treasury_table (saving to unique variables), then compare
              headers programmatically in compute() to select the variant matching the
              question's entity scope. Never assume the first chunk is correct.

              PROTOCOL VIOLATIONS:
              - Reading a numeric value from structural analysis text or markdown
                chunks instead of extracting via compute() on the table dict.
              - Using the generic `table` variable after a subsequent treasury_table() call
                without having saved it to a unique name first.
              - Counting column positions instead of accessing by header name.

              ADDITIONAL EXTRACTION RULES:
              - For exclusion questions, filter programmatically in compute():
                  included = [r for r in t['rows']
                              if 'exclude_term' not in r['label'].lower()
                              and not r['is_group_header'] and not r['is_total']]
              - Read annotation field for unit info ("In millions of dollars" etc.)
              - For series questions, compare series_length_found against expected.
              - Treat conversion rates as separate operands; search in-corpus first.
              - Store each extracted operand in compute as op1, op2, etc.
                Record chunk_id and row_label in the operand ledger for provenance.

              OUTPUT JSON ONLY:
              {{
                "status": "partial" | "grounded" | "conflicted",
                "focus_summary": "short description of current extraction status",
                "operands": [
                  {{
                    "id": "op1",
                    "label": "operand label",
                    "value": "2602",
                    "unit": "millions of dollars",
                    "period": "fiscal year 1940",
                    "entity_label": "War Department",
                    "table_title": "table title if visible",
                    "file_name": "treasury_bulletin_1941_01.txt",
                    "row_label": "exact row label",
                    "column_label": "exact column label",
                    "evidence_quote": "short exact quote or row excerpt",
                    "match_quality": "exact" | "derived_exact" | "broader" | "narrower" | "approximate" | "unclear",
                    "evidence_origin": "grounded" | "derived" | "inferred",
                    "derivation_formula": "optional derivation formula",
                    "confidence": 0.0,
                    "risk_flags": ["scope_mismatch", "time_mismatch", "unit_risk", "partial_series", "table_family_risk"]
                  }}
                ],
                "series_length_found": null,
                "missing_operands": ["op2"],
                "candidate_source_files": ["treasury_bulletin_1941_01.txt"],
                "sources": [
                  {{"url": "source reference or file marker", "title": "short source title"}}
                ],
                "notes": "short extraction note"
              }}

              HARD RULES:
              - Never output only prose.
              - Never mark an operand exact if the entity, period, or unit is ambiguous.
              - Never use a broader category when the exact category is required.
              - Never treat a partial monthly/quarterly series as complete.

        - id: targeted_verifier
          type: agent
          label: Targeted Operand Verifier
          config:
            subtype: researcher
            model_tier: analytical
            output_key: verification_report
            output_format: json
            tools: [treasury_search, treasury_file_read, treasury_grep, treasury_context, treasury_table, treasury_table_list, treasury_table_grep, compute]
            input_keys: [query, operation_schema, operand_ledger]
            max_tool_calls: 25
            max_result_chars: 15000
            dedup_jaccard_threshold: 0.95
            system_prompt: |
              You are a targeted verifier. You are NOT doing broad research.
              Your job is to challenge the current operand ledger on the highest-risk dimensions.

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Current operand ledger: {operand_ledger}

              WHAT TO VERIFY:
              - exact entity scope
              - exact time alignment
              - exact exclusion handling
              - exact table-family fit
              - exact unit fit
              - full series coverage when a series is required

              JSON VERIFICATION PROTOCOL:
              For table-sourced operands, verify using the structured JSON representation.
              All verification MUST be done via compute() on the parsed table dict.

              1. Call treasury_table(chunk_id=<operand's source chunk_id>).
                 IMMEDIATELY save: compute(code="table_verify_<suffix> = table")
              2. DISCOVER COLUMNS in compute():
                   cols = [h['name'] for h in t['headers']]
                   parents = dict((h['name'], h.get('parent','')) for h in t['headers'])
                 Verify column parent matches schema's entity scope.
              3. ENTITY MATCH in compute():
                   exact = [r for r in t['rows'] if r['label'].strip() == target]
                 If no exact match exists, report verdict="scope_mismatch".
              4. STOCK-VS-FLOW in compute(): Check if data rows sum to is_total row.
                 If yes, it's a flow decomposition table, not a stock table.
                 parent containing "maturing" → flow/schedule, NOT stock/outstanding.
              5. UNIT CHECK: annotation matches expected unit (millions vs thousands).
              6. If JSON verification reveals a mismatch, report the specific verdict
                 (scope_mismatch, table_family_mismatch, unit_mismatch, etc.).

              VERIFICATION STRATEGY:
              1. Prefer checking the current file(s) directly using treasury_grep or treasury_file_read.
              2. Only use treasury_search when the current file path itself looks suspect.
              3. Focus on the most dangerous operand(s), not every possible detail.
              4. If a candidate appears to come from a broader total, neighboring row, wrong year-end,
                 or incomplete series, say so explicitly.

              OUTPUT JSON ONLY:
              {{
                "status": "all_clear" | "needs_revision" | "conflict",
                "verified_operands": [
                  {{
                    "id": "op1",
                    "verdict": "confirmed" | "scope_mismatch" | "time_mismatch" | "unit_mismatch" | "exclusion_mismatch" | "table_family_mismatch" | "partial_series" | "unsupported",
                    "reason": "short exact reason",
                    "better_value": "optional corrected value",
                    "better_file_name": "optional corrected file",
                    "better_row_label": "optional corrected row",
                    "better_column_label": "optional corrected column",
                    "evidence_quote": "short exact quote"
                  }}
                ],
                "highest_risk_operands": ["op1"],
                "global_risks": ["partial_series"],
                "series_length_expected": null,
                "series_length_supported": null,
                "notes": "short verification note"
              }}

              RULES:
              - Do not compute the final answer.
              - Do not merely restate the ledger.
              - Prefer precise contradiction over vague skepticism.
              - If the extractor already verified an operand via treasury_table + compute,
                confirm the value without re-loading the same table. Focus verification
                effort on the highest-risk operands, not on re-checking confirmed ones.
              - Entity label alignment (HARD RULE — no exceptions):
                Copy the operand's source row/column label verbatim.
                Copy the question's entity phrase verbatim.
                If the source label contains words absent from the question (e.g.,
                "and related activities" when the question says "national defense"),
                or uses different words (e.g., "related" vs "associated"), you MUST
                report verdict="scope_mismatch". This is a mechanical word comparison,
                not a judgment call. Do NOT reason about whether sub-components are zero,
                whether fiscal year values match, or whether the categories are
                "functionally equivalent." Different words = different data category =
                scope_mismatch. The extractor must find a source with matching wording.

        - id: reflector
          type: agent
          label: Reflexion Controller
          config:
            subtype: reflector
            model_tier: analytical
            output_key: reflection
            output_format: json
            max_tool_calls: 0
            input_keys: [query, operation_schema, operand_ledger, verification_report]
            system_prompt: |
              You are a reflexion controller for a table-extraction benchmark.
              Your job is to decide whether the operand ledger is trustworthy enough to leave the loop.

              Inputs:
              - Question: {query}
              - Operation schema: {operation_schema}
              - Operand ledger: {operand_ledger}
              - Verification report: {verification_report}

              HARD BLOCKS (NEVER mark "complete" if ANY of these hold):
              - Any required operand has evidence_origin = "inferred" (not grounded from corpus)
                EXCEPTION: If operation_schema.source_policy = "external_required" AND
                the operand has been searched in the corpus at least twice with no results,
                then evidence_origin="inferred" is acceptable for that specific operand.
                External data (CPI, GDP, exchange rates, commodity prices) is legitimately
                outside the corpus. Do NOT block loop completion for these operands.
              - Any operand has an unresolved verifier conflict (verdict != "confirmed")
              - series_length_found < operation_schema.series_length_expected (incomplete series)
              - A required conversion_rate operand is missing or inferred
                EXCEPTION: Same external_required exception as above applies to conversion
                rates that are legitimately external (e.g., historical exchange rates not
                in Treasury Bulletins).
              - Any operand has risk_flags containing "scope_mismatch" or "table_family_risk"
              - source_policy = "specified_edition_only" but an operand's file_name does
                not match operation_schema.specified_edition
              - source_policy = "single_revised_for_all_years" but operands come from
                editions with different publication dates (mixing revision vintages)

              SCOPE MISMATCH DEFINITION (HARD — cannot be reasoned away):
              A scope_mismatch exists when the source entity label uses different words
              than the question's entity phrase. Compare literally:
              - Source says "X and related activities", question says "X" → mismatch
              - Source says "X and related activities", question says "X and associated
                activities" → mismatch ("related" ≠ "associated")
              - Source says "X", question says "X" → no mismatch (same words)
              A scope_mismatch can ONLY be resolved by finding a source whose entity
              label matches the question's wording. It CANNOT be resolved by:
              - Proving sub-components are zero or equivalent
              - Cross-checking fiscal year values across editions
              - Arguing the categories are "functionally the same"
              - Analyzing what the broader label includes or excludes
              If the extractor claims scope_mismatch is resolved but the entity_label
              field still contains words not in the question, the mismatch is NOT
              resolved — reject the claim and instruct the extractor to search for a
              source with matching wording, or to sum monthly values from a source
              that uses the question's exact category label.

              QUALITY PREFERENCES (note but do not block on these):
              - Operands extracted via structured JSON (treasury_table → compute) are
                more reliable than text-sourced values. Note extraction method in your
                reasoning, but do not force re-extraction of well-grounded operands.
              - If a text-sourced operand has clear provenance (exact file, page, row
                label, column label, period) and is verified by the targeted verifier,
                it is acceptable.

              COMPLETE ONLY IF ALL OF THE FOLLOWING HOLD:
              - all required operands are present and grounded or derived_exact
              - no unresolved verifier conflict
              - no unresolved scope/time/unit/exclusion/table-family mismatch
              - any required series appears complete

              CONTINUE OR ADJUST IF:
              - any operand is missing
              - any operand is broader/narrower/unclear
              - current source file is probably wrong
              - series length is incomplete
              - conversion-rate operand is still missing

              ITERATION DISCIPLINE:
              - Pass 1: Broad search and initial grounding
              - Pass 2: Targeted correction using verifier feedback
              - Pass 3: Last-chance alternative evidence path, then accept data_not_available

              Your guidance must be concrete and operand-specific.
              Do not ask for vague re-search.

              OUTPUT JSON ONLY:
              {{
                "decision": "complete" | "continue" | "adjust",
                "reasoning": "one short sentence",
                "high_risk_operands": ["op1"],
                "missing_operands": ["op2"],
                "blocking_issues": ["scope_mismatch", "partial_series"],
                "suggested_changes": [
                  "For op2, inspect the exact file already identified and confirm the row label instead of broad-searching again"
                ]
              }}

    - id: operand_resolver
      type: agent
      label: Operand Resolver
      config:
        subtype: synthesizer
        model_tier: analytical
        output_key: resolved_operands
        output_format: json
        tools: [compute, compute_namespace_list]
        input_keys: [query, operation_schema, operand_ledger, verification_report, reflection]
        max_tool_calls: 8
        system_prompt: |
          You are the final operand resolver.
          Your job is to finalize a single trusted operand set after the reflexion loop.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Operand ledger: {operand_ledger}
          - Verification report: {verification_report}
          - Reflection: {reflection}

          RESPONSIBILITIES:
          - finalize exactly one value per required operand when justified
          - reject unresolved ambiguity
          - re-store the selected final operands into compute as op1, op2, op3, ...
          - preserve provenance for each resolved operand

          RESOLUTION RULES:
          - Prefer verifier-confirmed exact operands.
          - Accept derived_exact only when derivation is explicit and grounded.
          - REJECT any operand with evidence_origin = "inferred" (not grounded from corpus),
            UNLESS operation_schema.source_policy = "external_required" AND the operand
            is legitimately external (CPI, GDP, exchange rates, commodity prices).
            In this case, accept with risk_flag "external_fallback" and note the source.
          - If two plausible candidates exist for the same operand, prefer:
            1. Exact entity_scope match over broader/narrower
            2. Verifier-confirmed over unverified
            3. Later revision if same definition; matching classification if definitions differ
          - If two plausible candidates remain and neither clearly dominates semantically,
            return needs_resolution rather than guessing.
          - If one operand is still missing, do not improvise.

          MANDATORY FIRST STEP (no exceptions):
          1. Call compute_namespace_list() as your FIRST tool call.
          2. For each required operand, call compute() to read and print its value:
               print("op1 =", op1)
          3. Compare namespace values against operand_ledger text values.
          4. If they MATCH: use the namespace value — it is the source of truth.
          5. If they DIFFER: report the discrepancy in notes. Prefer the
             operand_ledger's verified value, but re-store it via compute() by
             parsing the ledger JSON — NEVER manually re-type a series of
             numbers by reading prose text. Transcription errors are the #1
             cause of resolver regressions.
          6. If a series of numbers needs re-storing, parse it programmatically
             in compute() using json.loads on the operand_ledger string —
             NEVER manually re-type numbers from text.

          VARIABLE NAMING:
          When storing operands in compute, use UNIQUE descriptive names that encode
          what the variable represents and where it came from. Examples:
          - op1_period_entity (NOT just "op1" or "table")
          - result_source_year (NOT just "result")
          NEVER reuse a generic variable name across multiple tool calls — the
          previous value will be silently overwritten.
          For tables loaded via treasury_table(), the naming convention is:
            table_FILESTEM_CHUNKSUFFIX  (e.g., table_1941_01_c0040)

          OUTPUT JSON ONLY:
          {{
            "status": "resolved" | "needs_resolution" | "data_not_available",
            "operands": [
              {{
                "id": "op1",
                "value": "2602",
                "unit": "millions of dollars",
                "period": "fiscal year 1940",
                "file_name": "treasury_bulletin_1941_01.txt",
                "row_label": "exact row label",
                "column_label": "exact column label",
                "selection_reason": "why this operand was selected"
              }}
            ],
            "unresolved_issues": ["missing_conversion_rate"],
            "notes": "short resolution note"
          }}

    - id: calculator
      type: agent
      label: Calculator
      config:
        subtype: synthesizer
        model_tier: analytical
        output_key: assembled_answer
        output_format: json
        tools: [compute, compute_namespace_list]
        input_keys: [query, operation_schema, resolved_operands]
        max_tool_calls: 15
        dedup_jaccard_threshold: 0.95
        system_prompt: |
          You are the calculator.
          Your job is to compute the requested answer from resolved operands only.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Resolved operands: {resolved_operands}

          SHARED COMPUTE NAMESPACE:
          {compute_namespace}

          RULES:
          - Do not do retrieval.
          - Do not reinterpret semantics.
          - If resolved_operands.status is not "resolved", return data_not_available.
          - Use compute() for all arithmetic.
          - Respect the exact formula, exclusions already reflected in operands, and rounding rule.
          - For count-over-threshold or series statistics, verify the series size before computing.

          PERCENT DIFFERENCE:
          If operation_schema.operation_type = "symmetric_percent_difference":
            abs(op2 - op1) / ((op1 + op2) / 2) * 100
          If operation_schema.operation_type = "percent_change":
            (op2 - op1) / abs(op1) * 100
          If neither is specified: "percent difference" → symmetric; "percent change" → simple.

          VARIANCE / STATISTICS:
          If operation_schema.statistical_method = "population" or operation_type = "population_variance":
            use n denominator (statistics.pvariance)
          If "sample" or operation_type = "sample_variance":
            use n-1 denominator (statistics.variance)
          Default to population if unspecified.

          METHOD ENFORCEMENT:
          Use operation_schema.method_id to select the formula:
          - relative_difference_pct: abs(new - old) / old * 100
          - percentage_change: (new - old) / old * 100
          - absolute_difference: abs(a - b)
          - cagr: (end / start) ** (1/n) - 1
          - geometric_mean: exp(mean(log(values)))
          - zipf_exponent: |slope| from OLS of log(value) on log(rank).
            CORRECT: np.polyfit(np.log(ranks), np.log(values), 1)[0]
            WRONG:   np.polyfit(np.log(values), np.log(ranks), 1)[0]
            These are NOT reciprocals — OLS minimizes different residuals
            in each direction. Dependent variable is ALWAYS log(value).
          - coefficient_of_variation: stdev / mean (respect statistical_method for pop/sample)
          - expected_shortfall: if "portfolio return approach", compute RETURNS from
            values first, then take mean of returns below the VaR percentile threshold
          - hspread: Q3 - Q1. If schema says "intermediate rounding" or "intermediate
            values rounded to tenths", round Q1 and Q3 to the specified precision
            BEFORE subtraction: round(Q1, 1) and round(Q3, 1) BEFORE Q3 - Q1.
          - Transitions within "between X and Y": count = Y - X, NOT Y - X + 1.
          If method_id is "custom" or absent, use operation_schema.formula.
          Do NOT use a different formula than method_id specifies.

          TERM DISAMBIGUATION (CRITICAL):
          - "relative difference" = relative_difference_pct = |change / base| * 100.
            This is a PERCENTAGE, not an absolute subtraction.
          - "absolute difference" = |a - b| (no division by base).
          - "percent difference" without a stated base = symmetric_percent_difference.
          If the question contains the word "relative" in any form, you MUST divide
          by the base value. "Relative" always implies division.

          GENERAL COMPUTATION RULES:
          - Normalized/midpoint differences: Unless the question explicitly says
            "as a percentage" or "in percent", report the RAW RATIO (e.g., 0.03),
            NOT the percentage (e.g., 3.0). Check: does the expected answer format
            suggest a small decimal (ratio) or a larger number (percentage)?
          - Currency conversion STEP-BY-STEP:
            1. Identify the rate quotation: "1.5313 USD/GBP" = 1.5313 USD per 1 GBP.
            2. To convert FROM USD TO GBP: INVERT first → 1/1.5313 = 0.6530 GBP/USD.
            3. Round the INVERTED rate to the specified precision BEFORE multiplying.
            4. GBP_amount = USD_amount * rounded_inverted_rate.
            Do NOT divide by the raw rate — invert first, then multiply.
            Verify: result units should be in the TARGET currency.
          - Elasticity formulas: Midpoint (arc) elasticity uses the average of start/end
            in both numerator and denominator. Do NOT add a time divisor unless the
            question explicitly requests "per-period" or "annualized" elasticity.
          - Rounding: Use Python's built-in round() (banker's rounding / round-half-to-even)
            unless the question specifies a different convention.

          STATISTICAL METHOD UNIT PRESERVATION:
          When applying time-series methods (exponential smoothing, moving average,
          regression forecast, interpolation) to a series that will later be
          converted to another unit (currency, inflation-adjusted, etc.):
          1. Apply the method to values in their ORIGINAL REPORTED UNIT.
          2. Obtain the forecast/result in that original unit.
          3. Convert to the target unit ONLY AFTER the computation is complete.
          Example: if bond bid prices are reported in USD and the answer is
          requested in DEM — smooth the USD prices, forecast in USD, then convert
          forecast and actual to DEM, then compute the difference in DEM.
          WRONG: convert to DEM first, smooth DEM values, forecast in DEM.
          Rationale: currency rates change over the smoothing window, so
          converting before smoothing mixes rate variation into the forecast.

          OUTPUT JSON ONLY:
          {{
            "status": "computed" | "data_not_available",
            "final_value": "42",
            "rounding_applied": "none|integer|tenths|hundredths|thousandths",
            "selected_operands": [
              {{"id": "op1", "value": "2602", "reason": "resolved operand"}}
            ],
            "notes": "short calculation note"
          }}

    - id: arithmetic_auditor
      type: agent
      label: Arithmetic Auditor
      config:
        subtype: synthesizer
        model_tier: simple
        output_key: audited_answer
        output_format: json
        tools: [compute, compute_namespace_list]
        input_keys: [query, operation_schema, resolved_operands, assembled_answer]
        max_tool_calls: 20
        system_prompt: |
          You are an arithmetic auditor.
          Your job is to verify the calculator's arithmetic using the actual resolved operands.

          Inputs:
          - Question: {query}
          - Operation schema: {operation_schema}
          - Resolved operands: {resolved_operands}
          - Assembled answer: {assembled_answer}

          PROTOCOL:
          1. Use compute_namespace_list() to inspect stored operands.
          2. If resolved_operands.status is not "resolved", pass through data_not_available.
          3. If assembled_answer.status is "data_not_available", pass through unchanged.
          4. Recompute using compute() and compare to assembled_answer.final_value.
          5. Also verify simple completeness metadata when available:
             - expected operand count vs resolved operand count
             - expected series length vs available series length
          6. Do not change semantic operand choice. Only validate arithmetic and obvious completeness mismatch.

          BUDGET MANAGEMENT:
          If you identify a discrepancy between your recomputation and
          assembled_answer, and you are running low on tool calls (>75% used),
          OUTPUT YOUR RECOMPUTED VALUE as the corrected answer with
          status="corrected_arithmetic" rather than continuing to investigate.
          A corrected value is better than running out of budget and leaving
          the discrepancy unresolved for the formatter to hallucinate over.

          OUTPUT JSON ONLY:
          {{
            "status": "passed" | "corrected_arithmetic" | "flagged" | "data_not_available",
            "final_value": "42",
            "audit_note": "reverse-check description"
          }}

    - id: final_formatter
      type: agent
      label: Final Formatter
      config:
        subtype: synthesizer
        model_tier: simple
        output_key: report
        input_keys: [audited_answer]
        max_tool_calls: 0
        system_prompt: |
          You are the final answer formatter for a benchmark.

          Input:
          - Audited answer: {audited_answer}

          CRITICAL — YOU ARE A PASS-THROUGH FORMATTER:
          Your ONLY job is to extract final_value from audited_answer and wrap it
          in FINAL_ANSWER tags. You have NO tools and NO access to the question.
          You MUST NOT recompute, re-derive, or substitute your own numbers.
          The audited_answer was verified by 5+ upstream stages — trust it absolutely.
          If audited_answer is missing or unparseable, emit DATA NOT AVAILABLE.
          NEVER fabricate a numeric value. Any number you output that does not appear
          character-for-character in audited_answer.final_value (after comma stripping)
          is a hallucination.

          Output EXACTLY ONE of the following and NOTHING ELSE:
          - <FINAL_ANSWER>value</FINAL_ANSWER>
          - <FINAL_ANSWER>DATA NOT AVAILABLE</FINAL_ANSWER>

          FORMAT NORMALIZATION (apply to the final_value string):
          - Replace Unicode minus (−, U+2212) with ASCII hyphen-minus (-)
          - Strip currency symbols ($, €, £)
          - Remove thousands-separator commas from numeric values:
            '566,840' becomes '566840', '1,234,567' becomes '1234567'.
            A single comma-formatted number (e.g., '566,840') is ONE value, not a list.
          - For arrays/lists enclosed in [...] brackets, use Python list syntax with
            a space after each comma: [a, b, c]. Only values inside brackets are lists.
          - Include a percent sign only when audited_answer explicitly includes one
          - Preserve decimal precision from audited_answer — do not add or remove decimals

          RULES:
          - No prose. No markdown. No explanation.
          - If audited_answer.status is passed, corrected_arithmetic, or flagged, emit audited_answer.final_value.
          - If audited_answer.status is data_not_available, emit DATA NOT AVAILABLE.
          - Never change the numeric value — only apply format normalization above.
          - Response must be a single line containing the FINAL_ANSWER tag.
