# Root pyproject.toml (NOT a package — workspace only)
[project]
name = "databricks-deep-research-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "databricks-deep-research[all]",
]

[tool.uv.workspace]
members = ["databricks-deep-research", "databricks-deep-research-app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "types-PyYAML>=6.0.0",
    "build>=1.4.0",
]
benchmarks = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "databricks-vectorsearch>=0.55",
]

[tool.uv.sources]
databricks-deep-research = { workspace = true }
