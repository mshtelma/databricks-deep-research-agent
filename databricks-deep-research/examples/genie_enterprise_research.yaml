id: genie_enterprise_research
name: Genie Enterprise Research Pipeline
description: Enterprise Genie research with classical synthesis
version: 1
required_inputs: [query]
output_keys: [report]

tools:
  - name: genie
    kind: genie
    config:
      space_id: 01f10143a8721de393e79d4396185977
    description: "Enterprise Genie space for financial services portfolio and company analysis"

pools:
  - name: sources
    dedup_key: url
    max_items: 50
  - name: observations
    dedup_content_hash: true
    max_items: 30

root:
  id: main
  type: sequence
  label: Genie Enterprise Research Pipeline
  children:
    - id: coordinator
      type: agent
      label: Query Classifier
      config:
        subtype: coordinator
        model_tier: simple
        output_key: coordination

    - id: research_cycle
      type: plan_and_execute
      label: Genie Research Cycle
      config:
        planner_guidance: |
          Available tools for the researcher:
          - genie: Query the FSI Portfolio Assistant enterprise space using natural language
          There is NO web search or vector search available. Design all research steps to use genie.
          Ask precise business questions about industries, companies, market capitalization, and portfolio composition.
          Plan at least 2 distinct questions when the initial query has multiple dimensions.
        planner:
          subtype: planner
          model_tier: analytical
          output_key: plan
        items_path: steps
        item_state_key: current_step
        body:
          id: researcher
          type: agent
          label: Enterprise Researcher
          config:
            subtype: researcher
            model_tier: analytical
            output_key: findings
            tools: [genie]
            pool_writes:
              - pool: observations
                extract: findings
              - pool: sources
                extract: sources
            max_tool_calls: 6
        evaluator:
          subtype: reflector
          model_tier: analytical
          output_key: evaluation
          pool_inject:
            - pool: observations
              threshold: 0
        max_iterations: 2
        min_iterations: 1
        max_replan_cycles: 1

    - id: synthesizer
      type: agent
      label: Classical Report Synthesizer
      config:
        subtype: synthesizer
        grounding_mode: classical_lite
        model_tier: analytical
        output_key: report
        pool_inject:
          - pool: observations
            threshold: 0
          - pool: sources
            threshold: 0
        max_tool_calls: 0
