id: conditional_research
name: Conditional Research Pipeline
description: Conditional branching — simple queries get direct answers, complex ones get full research
version: 1
required_inputs: [query]
output_keys: [report]

pools:
  - name: sources
    dedup_key: url
    max_items: 100
  - name: observations
    dedup_content_hash: true
    max_items: 50

root:
  id: main
  type: sequence
  label: Conditional Research Pipeline
  children:
    # Step 1: Classify the query
    - id: coordinator
      type: agent
      label: Query Classifier
      config:
        subtype: coordinator
        model_tier: simple
        output_key: coordination

    # Step 2: Branch based on coordinator classification
    - id: branch
      type: conditional
      label: Complexity Branch
      config:
        conditions:
          - key: coordination.is_simple
            operator: eq
            value: true
        default_branch: 1
      children:
        # Branch 0: Simple query — direct synthesis (no research)
        - id: simple_synth
          type: agent
          label: Simple Synthesizer
          config:
            subtype: synthesizer
            model_tier: simple
            output_key: report
            max_tool_calls: 0

        # Branch 1 (default): Complex query — full research
        - id: full_research
          type: sequence
          label: Full Research Path
          children:
            - id: background
              type: agent
              label: Background Investigator
              config:
                subtype: background
                model_tier: simple
                output_key: background
                tools: [web_search]
                max_tool_calls: 3

            - id: research_cycle
              type: plan_and_execute
              label: Research Cycle
              config:
                planner:
                  subtype: planner
                  model_tier: analytical
                  output_key: plan
                items_path: steps
                item_state_key: current_step
                body:
                  id: researcher
                  type: agent
                  label: Researcher
                  config:
                    subtype: researcher
                    model_tier: analytical
                    output_key: findings
                    tools: [web_search, web_crawl]
                    pool_writes:
                      - pool: observations
                        extract: findings
                      - pool: sources
                        extract: sources
                    max_tool_calls: 8
                evaluator:
                  subtype: reflector
                  model_tier: analytical
                  output_key: evaluation
                max_iterations: 3
                min_iterations: 1
                max_replan_cycles: 1

            - id: synthesizer
              type: agent
              label: Report Synthesizer
              config:
                subtype: synthesizer
                model_tier: analytical
                output_key: report
                pool_inject:
                  - pool: observations
                    threshold: 0
                  - pool: sources
                    threshold: 0
                max_tool_calls: 0
