# Databricks Asset Bundle Configuration
# Enables infrastructure-as-code deployment with Lakebase provisioning
#
# Deploy with:
#   databricks bundle deploy                    # Deploy to dev (default)
#   databricks bundle deploy -t prod            # Deploy to production
#
# IMPORTANT: Lakebase instances incur cost immediately upon deployment!
# See: https://docs.databricks.com/pricing
#
# See: https://docs.databricks.com/dev-tools/bundles/resources

bundle:
  name: deep-research-agent

variables:
  # App naming
  app_name:
    description: "Name of the Databricks App"
    default: "deep-research-agent"

  lakebase_database:
    description: "Database name in Lakebase (we create and own this)"
    default: "deep_research"

  # Lakebase Autoscaling Configuration
  pg_version:
    description: "PostgreSQL version for Autoscaling projects"
    default: "17"

  autoscaling_min_cu:
    description: "Minimum compute units (Autoscaling)"
    default: "0.5"

  autoscaling_max_cu:
    description: "Maximum compute units (Autoscaling)"
    default: "2"

  # Autoscaling endpoint name (discovered post-deploy via discover_autoscaling_endpoint)
  endpoint_name:
    description: "Autoscaling endpoint name (discovered post-deploy, passed by provisioning scripts)"
    default: ""

  # Filled by deployment script after endpoint creation (PGHOST isn't known until then)
  pghost:
    description: "Lakebase Autoscaling endpoint hostname (resolved post-deploy)"
    default: ""

  # Brave Search API Secret Configuration
  brave_secret_scope:
    description: "Databricks secret scope containing the Brave API key"
    default: "deep-research-secrets"

  brave_secret_key:
    description: "Key name within the secret scope for Brave API key"
    default: "BRAVE_API_KEY"

  # Resource suffix for multi-user workspaces
  # CONSTRAINT: app_name + "-" + suffix must be ≤ 30 chars (Databricks app name limit).
  # With app_name="deep-research-agent" (20 chars), suffix can be at most 9 chars.
  resource_suffix:
    description: "Suffix for resource names to avoid collisions"
    default: "default"

resources:

  # NOTE: Database resources (database_instances, postgres_projects) are defined
  # at the TARGET level — not here. Each target declares only its backend type.
  # This prevents DAB from creating both Provisioned and Autoscaling resources
  # on every deploy (which causes "workspace limit" / "already exists" errors).

  apps:
    deep_research_agent:
      name: ${var.app_name}-${var.resource_suffix}
      description: "AI-powered deep research agent with 5-agent architecture"
      source_code_path: .

      # On-behalf-of-user authorization:
      # These scopes allow the app to access enterprise data sources
      # on behalf of the authenticated user (discovery + query).
      user_api_scopes:
        - sql
        - dashboards.genie
        - serving.serving-endpoints
        - vectorsearch.vector-search-endpoints
        - vectorsearch.vector-search-indexes

      # ---- Config: generates app.yaml during deploy ----
      # Variable-interpolated at deploy time. Replaces static app.yaml for production.
      config:
        command: ["uvicorn", "deep_research.main:app"]
        env:
          # MLflow
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_NAME
            value: "/Shared/deep-research-agent-experiments"
          # App config
          - name: SERVE_STATIC
            value: "true"
          - name: APP_ENV
            value: "production"
          - name: LOG_LEVEL
            value: "INFO"
          - name: APP_CONFIG_PATH
            value: "config/app.yaml"
          - name: LAKEBASE_DATABASE
            value: ${var.lakebase_database}
          # Lakebase (Autoscaling — harmless when pghost is empty)
          - name: ENDPOINT_NAME
            value: ${var.endpoint_name}
          - name: PGHOST
            value: ${var.pghost}
          # Brave Search (uses value_from to read from secret scope)
          - name: BRAVE_API_KEY
            value_from: "brave-api-key"

      # ---- Resource bindings ----
      resources:
        # =================================================================
        # Secrets
        # =================================================================
        - name: brave-api-key
          description: "Brave Search API key for web search functionality"
          secret:
            scope: ${var.brave_secret_scope}
            key: ${var.brave_secret_key}
            permission: READ

        # =================================================================
        # Model Serving Endpoints
        # All endpoints used by the app need CAN_QUERY permission
        # =================================================================

        # Claude models
        - name: endpoint-haiku
          description: "Claude Haiku 4.5 - fast, lightweight operations"
          serving_endpoint:
            name: databricks-claude-haiku-4-5
            permission: CAN_QUERY

        - name: endpoint-sonnet
          description: "Claude Sonnet 4.5 - balanced performance"
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY

        - name: endpoint-opus
          description: "Claude Opus 4.5 - complex reasoning"
          serving_endpoint:
            name: databricks-claude-opus-4-5
            permission: CAN_QUERY

        # GPT-5 models
        - name: endpoint-gpt5-nano
          description: "GPT-5 Nano - lightweight operations"
          serving_endpoint:
            name: databricks-gpt-5-nano
            permission: CAN_QUERY

        - name: endpoint-gpt5-mini
          description: "GPT-5 Mini - balanced performance"
          serving_endpoint:
            name: databricks-gpt-5-mini
            permission: CAN_QUERY

        - name: endpoint-gpt5
          description: "GPT-5 - complex reasoning"
          serving_endpoint:
            name: databricks-gpt-5-2
            permission: CAN_QUERY

        # Gemini models
        - name: endpoint-gemini-flash
          description: "Gemini 3 Flash - fast operations"
          serving_endpoint:
            name: databricks-gemini-3-flash
            permission: CAN_QUERY

        - name: endpoint-gemini-pro
          description: "Gemini 3 Pro - large context (1M tokens)"
          serving_endpoint:
            name: databricks-gemini-3-pro
            permission: CAN_QUERY

        # =================================================================
        # Optional: MLflow Experiment
        # Databricks Apps does NOT support mlflow_experiment as a resource type.
        # Experiment permissions must be granted manually or via a setup script.
        # =================================================================
        # - name: experiment
        #   description: "MLflow experiment for tracing"
        #   mlflow_experiment:
        #     path: /Shared/deep-research-agent-experiments
        #     permission: CAN_EDIT

targets:
  dev:
    mode: development
    workspace:
      profile: e2-demo-west
    variables:
      resource_suffix: "dev"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  ais:
    mode: development
    default: true
    workspace:
      profile: ais
    variables:
      resource_suffix: "ais"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  e2e:
    mode: development
    default: false
    workspace:
      profile: ais
    variables:
      resource_suffix: "e2e"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  local-dev:
    mode: development
    default: false
    workspace:
      profile: ais
    variables:
      resource_suffix: "local"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}
