# Databricks Asset Bundle Configuration
# Enables infrastructure-as-code deployment with Lakebase provisioning
#
# Deploy with:
#   databricks bundle deploy                    # Deploy to dev (default)
#   databricks bundle deploy -t prod            # Deploy to production
#
# IMPORTANT: Lakebase instances incur cost immediately upon deployment!
# See: https://docs.databricks.com/pricing
#
# See: https://docs.databricks.com/dev-tools/bundles/resources

bundle:
  name: deep-research-agent

sync:
  include:
    - "wheels/**"
  exclude:
    - "src.zip"
    - "mlflow.db"
    - "e2e/**"
    - "frontend/**"
    - "tests/**"
    - "uv.lock"
    - "Makefile"
    - "README.md"
    - "scripts/output/**"
  # NOTE: app.yaml IS synced intentionally. The Databricks Apps runtime
  # requires a file-based app spec. The config: section below overrides
  # env vars at deploy time with production values.

variables:
  # App naming
  app_name:
    description: "Name of the Databricks App"
    default: "deep-research-agent"

  lakebase_database:
    description: "Database name in Lakebase (we create and own this)"
    default: "deep_research"

  # Lakebase connection (set by deploy script after endpoint discovery).
  # Defaults to the literal sentinel "pending" so that read-only bundle
  # commands (`bundle summary`, `bundle validate`) work without `--var`
  # overrides — the Makefile uses `bundle summary` to resolve APP_NAME and
  # cannot pass real values before Step 5. The app's credential_factory
  # treats "pending" as unset at runtime (see `_meaningful()` in
  # `src/deep_research/db/credential_factory.py`), so a "pending"-deployed
  # bundle fails loudly at app boot rather than corrupting downstream
  # behaviour.
  endpoint_name:
    description: "Autoscaling endpoint name (discovered during deploy)"
    default: "pending"

  pghost:
    description: "PostgreSQL host for Lakebase (discovered during deploy)"
    default: "pending"

  # DAB-managed Lakebase Postgres app resource binding.
  # These two vars are resolved at deploy time from the live workspace by
  # `app_postgres_resource.py --print-bundle-vars` (or `preflight.py`) and
  # injected via `--var` from the Makefile. Defaulting to the literal
  # "pending" sentinel makes `bundle summary` / `bundle validate` succeed
  # without an --var override; the preflight asserts that "pending" never
  # reaches `bundle deploy`. The lakebase-postgres app resource below
  # references these values so the app binding is fully DAB-managed
  # (no Apps-API write side).
  postgres_branch:
    description: "Lakebase Postgres branch resource path (resolved during deploy)"
    default: "pending"

  postgres_database_resource:
    description: "Lakebase Postgres database resource path (resolved during deploy)"
    default: "pending"

  # SQL Warehouse used by the framework's text-table tools
  # (table_search / table_read / table_neighbors / table_load /
  # table_aggregate). Resolved at deploy time by `preflight.py
  # resolve_warehouse_id_or_fail` and injected via `--var` from the
  # Makefile. Defaulting to the literal "pending" sentinel keeps
  # `bundle summary` / `bundle validate` working without an --var
  # override; preflight asserts the sentinel never reaches `bundle
  # deploy`. Without this var, the deployed app's
  # `workflow_runner_factory` silently leaves `schema_cache` /
  # `sql_executor` unset and any workflow that declares a table_*
  # tool fails mid-stream as a misleading
  # "missing declared tools" WorkflowError.
  storage_warehouse_id:
    description: "SQL Warehouse ID for text-table tools (resolved during deploy)"
    default: "pending"

  # Lakebase Autoscaling Configuration
  pg_version:
    description: "PostgreSQL version for Autoscaling projects"
    default: "17"

  autoscaling_min_cu:
    description: "Minimum compute units (Autoscaling)"
    default: "0.5"

  autoscaling_max_cu:
    description: "Maximum compute units (Autoscaling)"
    default: "2"

  # Brave Search API Secret Configuration
  brave_secret_scope:
    description: "Databricks secret scope containing the Brave API key"
    default: "deep-research-secrets"

  brave_secret_key:
    description: "Key name within the secret scope for Brave API key"
    default: "BRAVE_API_KEY"

  # Resource suffix for multi-user workspaces
  # CONSTRAINT: app_name + "-" + suffix must be ≤ 30 chars (Databricks app name limit).
  # With app_name="deep-research-agent" (20 chars), suffix can be at most 9 chars.
  resource_suffix:
    description: "Suffix for resource names to avoid collisions"
    default: "default"

resources:

  # NOTE: Database resources (database_instances, postgres_projects) are defined
  # at the TARGET level — not here. Each target declares only its backend type.
  # This prevents DAB from creating both Provisioned and Autoscaling resources
  # on every deploy (which causes "workspace limit" / "already exists" errors).

  apps:
    deep_research_agent:
      name: ${var.app_name}-${var.resource_suffix}
      description: "AI-powered deep research agent with 5-agent architecture"
      source_code_path: .

      # On-behalf-of-user authorization:
      # These scopes allow the app to access enterprise data sources
      # on behalf of the authenticated user (discovery + query).
      # `apps` is required by Deploy Here for app create/update/list calls.
      # Source upload uses the app service principal, not the user's OBO token.
      user_api_scopes:
        - apps
        - sql
        - dashboards.genie
        - serving.serving-endpoints
        - vectorsearch.vector-search-endpoints
        - vectorsearch.vector-search-indexes
        # Lists Unity Catalog connections backing MCP servers
        # (GET /api/2.1/unity-catalog/connections) for Designer/chat MCP discovery.
        # NOTE: the bundle rejects the bare `unity-catalog` OAuth scope; the valid
        # app token is `catalog.connections` (see databricks-sdk-go#1528). If OBO
        # still 403s at runtime, discovery fail-softs to an empty attach list.
        #
        # ⚠️ External-MCP INVOKE (/api/2.0/mcp/external/{conn}) still 403s under
        # OBO with this set. `all-apis` is NOT a valid Apps scope (real deploy
        # rejects it: "The specified scope all-apis is not a valid scope"), and
        # `catalog.connections` is list-only. The invoke fix is decided in
        # docs/mcp-external-obo-scope.md (OBO-scope vs SP-identity) — do not
        # re-add `all-apis`.
        - catalog.connections

      # ---- Config ----
      # NOTE: endpoint_name and pghost default to "pending" (not "")
      # because DAB strips empty-string values, producing bare name-only
      # entries that the Apps runtime rejects. The deploy script overrides
      # these with real values via --var in Step 5.
      config:
        command:
          - "bash"
          - "entrypoint.sh"
        env:
          # MLflow
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_NAME
            value: "/Shared/deep-research-agent-experiments"

          # App config
          - name: SERVE_STATIC
            value: "true"
          - name: APP_ENV
            value: "production"
          - name: LOG_LEVEL
            value: "INFO"
          - name: APP_CONFIG_PATH
            value: "config/app.yaml"

          # Lakebase
          - name: LAKEBASE_DATABASE
            value: ${var.lakebase_database}
          - name: ENDPOINT_NAME
            value: ${var.endpoint_name}
          - name: PGHOST
            value: ${var.pghost}

          # SQL Warehouse — used by the text-table tools
          # (workflow_runner_factory wires schema_cache + sql_executor
          # only when this is set).
          - name: STORAGE_WAREHOUSE_ID
            value: ${var.storage_warehouse_id}

          # Brave Search (references 'brave-api-key' resource binding)
          - name: BRAVE_API_KEY
            value_from: "brave-api-key"

      # ---- Resource bindings ----
      resources:
        # =================================================================
        # Secrets
        # =================================================================
        - name: brave-api-key
          description: "Brave Search API key for web search functionality"
          secret:
            scope: ${var.brave_secret_scope}
            key: ${var.brave_secret_key}
            permission: READ

        - name: tavily-mcp-connection
          description: "Unity Catalog connection for Tavily MCP"
          uc_securable:
            securable_full_name: tavily_mcp
            securable_type: CONNECTION
            permission: USE_CONNECTION

        # =================================================================
        # Model Serving Endpoints
        # All endpoints used by the app need CAN_QUERY permission
        # =================================================================

        # Claude models
        - name: endpoint-haiku
          description: "Claude Haiku 4.5 - fast, lightweight operations"
          serving_endpoint:
            name: databricks-claude-haiku-4-5
            permission: CAN_QUERY

        - name: endpoint-sonnet
          description: "Claude Sonnet 4.5 - balanced performance"
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY

        - name: endpoint-opus
          description: "Claude Opus 4.5 - complex reasoning"
          serving_endpoint:
            name: databricks-claude-opus-4-5
            permission: CAN_QUERY

        # GPT-5 models
        - name: endpoint-gpt5-nano
          description: "GPT-5 Nano - lightweight operations"
          serving_endpoint:
            name: databricks-gpt-5-nano
            permission: CAN_QUERY

        - name: endpoint-gpt5-mini
          description: "GPT-5 Mini - balanced performance"
          serving_endpoint:
            name: databricks-gpt-5-mini
            permission: CAN_QUERY

        - name: endpoint-gpt5
          description: "GPT-5 - complex reasoning"
          serving_endpoint:
            name: databricks-gpt-5-2
            permission: CAN_QUERY

        # Gemini models
        - name: endpoint-gemini-flash
          description: "Gemini 3 Flash - fast operations"
          serving_endpoint:
            name: databricks-gemini-3-flash
            permission: CAN_QUERY

        - name: endpoint-gemini-pro
          description: "Gemini 3 Pro - large context (1M tokens)"
          serving_endpoint:
            name: databricks-gemini-3-pro
            permission: CAN_QUERY

        # =================================================================
        # Lakebase Postgres binding (DAB-managed)
        # =================================================================
        # The branch and database paths are resolved at deploy time by
        # `app_postgres_resource.py --print-bundle-vars` and injected as
        # `--var` arguments from the Makefile. A "pending" sentinel for
        # either field blocks the deploy via preflight rather than
        # producing a broken app binding. The Apps-API write side in
        # `configure_app_postgres_resource()` is deprecated; this YAML
        # block is now the single source of truth.
        - name: lakebase-postgres
          description: "Lakebase Postgres database used by the app"
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database_resource}
            permission: CAN_CONNECT_AND_CREATE

        # =================================================================
        # Optional: MLflow Experiment
        # Databricks Apps does NOT support mlflow_experiment as a resource type.
        # Experiment permissions must be granted manually or via a setup script.
        # =================================================================
        # - name: experiment
        #   description: "MLflow experiment for tracing"
        #   mlflow_experiment:
        #     path: /Shared/deep-research-agent-experiments
        #     permission: CAN_EDIT

targets:
  dev:
    mode: development
    workspace:
      profile: e2-demo-west
    variables:
      resource_suffix: "dev"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  ais:
    mode: development
    default: true
    workspace:
      profile: ais
    variables:
      resource_suffix: "ais"
      # Pinned SQL Warehouse for text-table tools (Serverless Starter).
      # Read by `make deploy`/`app-deploy` and passed to preflight via
      # --storage-warehouse-id so the full deploy no longer depends on
      # auto-discovering a single STARTED warehouse.
      storage_warehouse_id: "d837825f69a03500"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  e2e:
    mode: development
    default: false
    workspace:
      profile: ais
    variables:
      resource_suffix: "e2e"
      storage_warehouse_id: "d837825f69a03500"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}

  local-dev:
    mode: development
    default: false
    workspace:
      profile: ais
    variables:
      resource_suffix: "local"
      storage_warehouse_id: "d837825f69a03500"
    resources:
      postgres_projects:
        deep_research_project:
          project_id: deep-research-${var.resource_suffix}
          display_name: deep-research-${var.resource_suffix}
          pg_version: ${var.pg_version}
