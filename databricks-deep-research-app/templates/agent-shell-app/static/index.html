<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Deep Research Shell App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 24px;
        color: #172033;
        background: #f6f7f9;
      }
      .shell {
        max-width: 920px;
        min-height: calc(100vh - 48px);
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { font-size: 18px; line-height: 1.25; font-weight: 650; margin: 0; }
      #conversation { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 320px; }
      .query-bubble {
        align-self: flex-end;
        max-width: min(720px, 92%);
        padding: 10px 12px;
        border-radius: 8px;
        background: #1f3b5b;
        color: #fff;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .activity-panel {
        border: 1px solid #d7dce5;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }
      .activity-panel summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 12px;
        cursor: pointer;
        list-style: none;
      }
      .activity-panel summary::-webkit-details-marker { display: none; }
      .summary-title { font-weight: 650; min-width: 0; }
      .summary-meta { color: #637083; font-size: 12px; white-space: nowrap; }
      .activity-list {
        list-style: none;
        margin: 0;
        padding: 0 12px 12px;
        max-height: 360px;
        overflow: auto;
        border-top: 1px solid #edf0f5;
      }
      .activity-item {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #f0f2f6;
      }
      .activity-item:last-child { border-bottom: 0; }
      .activity-dot {
        width: 8px;
        height: 8px;
        margin-top: 7px;
        border-radius: 999px;
        background: #8a95a6;
      }
      .activity-item[data-status="running"] .activity-dot { background: #2463eb; }
      .activity-item[data-status="done"] .activity-dot { background: #1a7f37; }
      .activity-item[data-status="warning"] .activity-dot { background: #b7791f; }
      .activity-item[data-status="error"] .activity-dot { background: #b91c1c; }
      .activity-title {
        font-size: 13px;
        font-weight: 650;
        line-height: 1.35;
        color: #1d2738;
      }
      .activity-detail {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.4;
        color: #596579;
        overflow-wrap: anywhere;
      }
      .activity-type {
        align-self: start;
        padding: 2px 7px;
        border-radius: 999px;
        background: #eef2f7;
        color: #536072;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: nowrap;
      }
      .answer {
        border: 1px solid #d7dce5;
        border-radius: 8px;
        background: #fff;
        padding: 18px;
      }
      .markdown-body {
        font-size: 15px;
        line-height: 1.65;
        color: #172033;
      }
      .markdown-body > :first-child { margin-top: 0; }
      .markdown-body > :last-child { margin-bottom: 0; }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        line-height: 1.25;
        margin: 1.3em 0 0.55em;
        color: #101828;
      }
      .markdown-body h1 { font-size: 24px; }
      .markdown-body h2 { font-size: 20px; }
      .markdown-body h3 { font-size: 17px; }
      .markdown-body h4 { font-size: 15px; }
      .markdown-body p { margin: 0 0 0.9em; }
      .markdown-body a { color: #0f5cc0; text-decoration: underline; text-underline-offset: 2px; }
      .markdown-body ul,
      .markdown-body ol { padding-left: 1.4em; margin: 0 0 1em; }
      .markdown-body li { margin: 0.25em 0; }
      .markdown-body blockquote {
        margin: 0 0 1em;
        padding: 0.1em 0 0.1em 1em;
        border-left: 3px solid #c9d3e3;
        color: #475467;
      }
      .markdown-body code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        background: #eef2f7;
        border-radius: 4px;
        padding: 0.12em 0.32em;
      }
      .markdown-body pre {
        overflow: auto;
        padding: 12px;
        border-radius: 8px;
        background: #101828;
        color: #f8fafc;
      }
      .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1em;
        font-size: 14px;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid #d7dce5;
        padding: 7px 8px;
        vertical-align: top;
      }
      .markdown-body th { background: #f3f5f8; font-weight: 650; }
      .markdown-body hr { border: 0; border-top: 1px solid #d7dce5; margin: 1.4em 0; }
      #row { display: flex; gap: 8px; }
      #q { flex: 1; min-width: 0; padding: 10px 11px; border: 1px solid #bcc5d3; border-radius: 8px; font: inherit; background: #fff; }
      button { padding: 10px 16px; border: none; background: #1f3b5b; color: white; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 650; }
      button[disabled] { opacity: 0.5; cursor: wait; }
      [hidden] { display: none !important; }
      @media (max-width: 640px) {
        body { padding: 14px; }
        .shell { min-height: calc(100vh - 28px); }
        .activity-item { grid-template-columns: 10px minmax(0, 1fr); }
        .activity-type { grid-column: 2; justify-self: start; }
        #row { flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Deep Research Shell App</h1>
      </header>
      <main id="conversation" aria-live="polite">
        <div id="queryBubble" class="query-bubble" hidden></div>
        <details id="activityPanel" class="activity-panel" open hidden>
          <summary>
            <span id="activityStatus" class="summary-title">Activity</span>
            <span id="activityMeta" class="summary-meta">0 events</span>
          </summary>
          <ol id="activityList" class="activity-list"></ol>
        </details>
        <article id="answer" class="answer" hidden>
          <div id="answerBody" class="markdown-body"></div>
        </article>
      </main>
      <div id="row">
        <input id="q" type="text" placeholder="Ask a research question..." autofocus />
        <button id="send">Send</button>
      </div>
    </div>
    <script>
      const queryBubbleEl = document.getElementById('queryBubble');
      const activityPanelEl = document.getElementById('activityPanel');
      const activityStatusEl = document.getElementById('activityStatus');
      const activityMetaEl = document.getElementById('activityMeta');
      const activityListEl = document.getElementById('activityList');
      const answerEl = document.getElementById('answer');
      const answerBodyEl = document.getElementById('answerBody');
      const qEl = document.getElementById('q');
      const sendEl = document.getElementById('send');
      const SHELL_APP_TEMPLATE_VERSION = '2026-05-25.1';
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      let eventCount = 0;
      let toolCount = 0;
      let warningCount = 0;
      let latestFinalReport = '';
      const nodeLabels = new Map();

      console.info('[shell-app] template loaded', { version: SHELL_APP_TEMPLATE_VERSION });

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      function isSafeUrl(value) {
        try {
          const url = new URL(String(value), window.location.origin);
          return ['http:', 'https:', 'mailto:'].includes(url.protocol);
        } catch {
          return false;
        }
      }

      function renderInline(text) {
        const tokens = [];
        const addToken = (html) => {
          const key = '%%TOKEN' + tokens.length + '%%';
          tokens.push([key, html]);
          return key;
        };

        let working = String(text).replace(/`([^`]+)`/g, (_match, code) => {
          return addToken('<code>' + escapeHtml(code) + '</code>');
        });

        working = working.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
          if (!isSafeUrl(href)) return match;
          return addToken(
            '<a href="' + escapeAttribute(href) + '" target="_blank" rel="noopener noreferrer">' +
              escapeHtml(label) +
            '</a>'
          );
        });

        let html = escapeHtml(working);
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        html = html.replace(/(^|[^\*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
        html = html.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
        for (const [key, value] of tokens) {
          html = html.replaceAll(key, value);
        }
        return html;
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function splitTableRow(line) {
        return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
      }

      function tableAlignment(separator) {
        const trimmed = separator.trim();
        if (trimmed.startsWith(':') && trimmed.endsWith(':')) return 'center';
        if (trimmed.endsWith(':')) return 'right';
        if (trimmed.startsWith(':')) return 'left';
        return '';
      }

      function startsMarkdownBlock(line, nextLine) {
        const trimmed = line.trim();
        return (
          trimmed.length === 0 ||
          /^#{1,6}\s+/.test(trimmed) ||
          /^```/.test(trimmed) ||
          /^>\s?/.test(trimmed) ||
          /^[-*_]{3,}$/.test(trimmed) ||
          /^[-+*]\s+/.test(trimmed) ||
          /^\d+\.\s+/.test(trimmed) ||
          (line.includes('|') && Boolean(nextLine) && isTableSeparator(nextLine))
        );
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        const html = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];
          const trimmed = line.trim();
          const nextLine = lines[i + 1] || '';

          if (!trimmed) {
            i += 1;
            continue;
          }

          if (/^```/.test(trimmed)) {
            const lang = trimmed.slice(3).trim().split(/\s+/)[0] || '';
            const code = [];
            i += 1;
            while (i < lines.length && !/^```/.test(lines[i].trim())) {
              code.push(lines[i]);
              i += 1;
            }
            if (i < lines.length) i += 1;
            const langAttr = lang ? ' data-language="' + escapeAttribute(lang) + '"' : '';
            html.push('<pre><code' + langAttr + '>' + escapeHtml(code.join('\n')) + '</code></pre>');
            continue;
          }

          const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            const level = Math.min(heading[1].length, 4);
            html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
            i += 1;
            continue;
          }

          if (line.includes('|') && isTableSeparator(nextLine)) {
            const headers = splitTableRow(line);
            const alignments = splitTableRow(nextLine).map(tableAlignment);
            const rows = [];
            i += 2;
            while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
              rows.push(splitTableRow(lines[i]));
              i += 1;
            }
            html.push(
              '<table><thead><tr>' +
              headers.map((cell, index) => {
                const align = alignments[index] ? ' style="text-align:' + alignments[index] + '"' : '';
                return '<th' + align + '>' + renderInline(cell) + '</th>';
              }).join('') +
              '</tr></thead><tbody>' +
              rows.map((row) => (
                '<tr>' +
                headers.map((_header, index) => {
                  const align = alignments[index] ? ' style="text-align:' + alignments[index] + '"' : '';
                  return '<td' + align + '>' + renderInline(row[index] || '') + '</td>';
                }).join('') +
                '</tr>'
              )).join('') +
              '</tbody></table>'
            );
            continue;
          }

          if (/^>\s?/.test(trimmed)) {
            const quoteLines = [];
            while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
              quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
              i += 1;
            }
            html.push('<blockquote>' + renderMarkdown(quoteLines.join('\n')) + '</blockquote>');
            continue;
          }

          if (/^[-+*]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
            const ordered = /^\d+\.\s+/.test(trimmed);
            const tag = ordered ? 'ol' : 'ul';
            const marker = ordered ? /^\d+\.\s+(.+)$/ : /^[-+*]\s+(.+)$/;
            const items = [];
            while (i < lines.length) {
              const match = lines[i].trim().match(marker);
              if (!match) break;
              items.push('<li>' + renderInline(match[1]) + '</li>');
              i += 1;
            }
            html.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
            continue;
          }

          if (/^[-*_]{3,}$/.test(trimmed)) {
            html.push('<hr>');
            i += 1;
            continue;
          }

          const paragraph = [trimmed];
          i += 1;
          while (
            i < lines.length &&
            lines[i].trim() &&
            !startsMarkdownBlock(lines[i], lines[i + 1] || '')
          ) {
            paragraph.push(lines[i].trim());
            i += 1;
          }
          html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
        }

        return html.join('\n');
      }

      function resetUi(query) {
        eventCount = 0;
        toolCount = 0;
        warningCount = 0;
        latestFinalReport = '';
        nodeLabels.clear();
        queryBubbleEl.textContent = query;
        queryBubbleEl.hidden = false;
        activityPanelEl.hidden = false;
        activityPanelEl.open = true;
        activityStatusEl.textContent = 'Working';
        activityMetaEl.textContent = '0 events';
        activityListEl.innerHTML = '';
        answerBodyEl.innerHTML = '';
        answerEl.hidden = true;
      }

      function parsePayload(dataText) {
        try {
          return JSON.parse(dataText);
        } catch {
          return { raw: dataText };
        }
      }

      function eventLabel(eventName) {
        return String(eventName || 'event').replace(/_/g, ' ');
      }

      function friendlyNode(nodeId) {
        const label = nodeLabels.get(nodeId);
        if (label) return label;
        return String(nodeId || '').replace(/[-_]/g, ' ');
      }

      function compactJson(value, maxLength) {
        const text = JSON.stringify(value || {});
        if (text.length <= maxLength) return text;
        return text.slice(0, maxLength - 15).trimEnd() + ' ...(truncated)';
      }

      function trimText(value, maxLength) {
        const text = String(value || '').replace(/\s+/g, ' ').trim();
        if (text.length <= maxLength) return text;
        return text.slice(0, maxLength - 15).trimEnd() + ' ...(truncated)';
      }

      function formatDuration(ms) {
        const value = Number(ms);
        if (!Number.isFinite(value) || value < 0) return '';
        if (value < 1000) return Math.round(value) + ' ms';
        return (value / 1000).toFixed(value < 10000 ? 1 : 0) + ' s';
      }

      function formatTime(timestamp) {
        if (!timestamp) return '';
        try {
          return timeFormatter.format(new Date(timestamp));
        } catch {
          return '';
        }
      }

      function eventStatus(eventName, payload) {
        if (eventName === 'error') return 'error';
        if (eventName === 'tool_result' && /failed|error|429|exception/i.test(String(payload.result_summary || payload.raw || ''))) {
          return 'warning';
        }
        if (eventName.endsWith('_completed') || eventName === 'tool_result' || eventName === 'agent_output') return 'done';
        if (eventName.endsWith('_started') || eventName === 'tool_call') return 'running';
        return 'neutral';
      }

      function formatEventTitle(eventName, payload) {
        if (eventName === 'workflow_started') return 'Started ' + (payload.workflow_name || 'workflow');
        if (eventName === 'workflow_completed') return 'Workflow completed';
        if (eventName === 'node_started') return 'Started ' + (payload.label || friendlyNode(payload.node_id) || 'node');
        if (eventName === 'node_completed') return 'Completed ' + (friendlyNode(payload.node_id) || 'node');
        if (eventName === 'tool_call') return (payload.tool_name || 'Tool') + ' call';
        if (eventName === 'tool_result') return (payload.tool_name || 'Tool') + ' result';
        if (eventName === 'agent_output') return 'Output from ' + (friendlyNode(payload.node_id) || 'agent');
        if (eventName === 'coordinator_classified') return 'Coordinator classified request';
        if (eventName === 'synthesis_started') return 'Synthesis started';
        if (eventName === 'client_waiting') return 'Waiting for stream frames';
        return eventLabel(eventName).replace(/^\w/, (c) => c.toUpperCase());
      }

      function formatEventDetail(eventName, payload) {
        if (payload.raw) return trimText(payload.raw, 220);
        if (eventName === 'workflow_started') {
          return payload.workflow_id ? 'Workflow id: ' + payload.workflow_id : '';
        }
        if (eventName === 'node_started') {
          return [payload.node_type, payload.node_id].filter(Boolean).join(' | ');
        }
        if (eventName === 'node_completed') {
          return formatDuration(payload.duration_ms);
        }
        if (eventName === 'tool_call') {
          const args = payload.arguments || {};
          if (args.query) return 'Searching: ' + trimText(args.query, 180);
          return Object.keys(args).length ? 'Arguments: ' + compactJson(args, 180) : '';
        }
        if (eventName === 'tool_result') {
          return trimText(payload.result_summary || 'Tool finished', 220);
        }
        if (eventName === 'agent_output') {
          const key = payload.output_key ? 'Key: ' + payload.output_key : '';
          const preview = payload.output_preview ? trimText(payload.output_preview, 160) : '';
          return [key, preview].filter(Boolean).join(' | ');
        }
        if (eventName === 'coordinator_classified') {
          const parts = [];
          if (payload.complexity) parts.push('Complexity: ' + payload.complexity);
          if (payload.recommended_depth) parts.push('Depth: ' + payload.recommended_depth);
          if (typeof payload.is_simple === 'boolean') parts.push(payload.is_simple ? 'Simple path' : 'Research path');
          return parts.join(' | ');
        }
        if (eventName === 'synthesis_started') {
          const parts = [];
          if (payload.total_observations != null) parts.push(payload.total_observations + ' observations');
          if (payload.total_sources != null) parts.push(payload.total_sources + ' sources');
          return parts.join(' | ');
        }
        if (eventName === 'workflow_completed') {
          const parts = [];
          const duration = formatDuration(payload.duration_ms);
          if (duration) parts.push(duration);
          if (payload.total_tokens != null) parts.push(payload.total_tokens + ' tokens');
          if (payload.final_report) parts.push('Final report ready');
          return parts.join(' | ');
        }
        if (eventName === 'client_waiting') return payload.message || '';
        return compactJson(payload, 180);
      }

      function updateActivitySummary(done) {
        const parts = [eventCount + (eventCount === 1 ? ' event' : ' events')];
        if (toolCount) parts.push(toolCount + (toolCount === 1 ? ' tool call' : ' tool calls'));
        if (warningCount) parts.push(warningCount + (warningCount === 1 ? ' warning' : ' warnings'));
        activityStatusEl.textContent = done ? 'Activity completed' : 'Activity';
        activityMetaEl.textContent = parts.join(' | ');
      }

      function appendActivity(eventName, payload) {
        if (eventName === 'node_started' && payload.node_id && payload.label) {
          nodeLabels.set(payload.node_id, payload.label);
        }
        if (eventName === 'workflow_completed' && payload.final_report) {
          latestFinalReport = payload.final_report;
        }
        if (eventName === 'tool_call') toolCount += 1;

        const status = eventStatus(eventName, payload);
        if (status === 'warning') warningCount += 1;
        eventCount += 1;
        updateActivitySummary(false);

        const item = document.createElement('li');
        item.className = 'activity-item';
        item.dataset.status = status;

        const dot = document.createElement('span');
        dot.className = 'activity-dot';
        dot.setAttribute('aria-hidden', 'true');

        const main = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'activity-title';
        title.textContent = formatEventTitle(eventName, payload);
        const detail = document.createElement('div');
        detail.className = 'activity-detail';
        const time = formatTime(payload.timestamp);
        const detailText = formatEventDetail(eventName, payload);
        detail.textContent = [detailText, time].filter(Boolean).join(' | ');
        main.appendChild(title);
        if (detail.textContent) main.appendChild(detail);

        const type = document.createElement('span');
        type.className = 'activity-type';
        type.textContent = eventName;

        item.appendChild(dot);
        item.appendChild(main);
        item.appendChild(type);
        activityListEl.appendChild(item);
        activityListEl.scrollTop = activityListEl.scrollHeight;
      }

      function renderFinalAnswer(output) {
        const markdown = String(output || latestFinalReport || '').trim();
        answerBodyEl.innerHTML = renderMarkdown(markdown || 'No response returned.');
        answerEl.hidden = false;
        activityPanelEl.open = false;
        updateActivitySummary(true);
      }

      async function sendQuery() {
        const query = qEl.value.trim();
        if (!query) return;
        sendEl.disabled = true;
        resetUi(query);
        let firstFrameSeen = false;
        let streamFrameCount = 0;
        let buffer = '';
        const stalledTimer = window.setTimeout(() => {
          if (!firstFrameSeen) appendActivity('client_waiting', { message: 'No stream frames received yet.' });
        }, 3000);

        function drainFrames(force) {
          // EventSourceResponse emits CRLF-delimited SSE frames; browsers may
          // preserve those carriage returns when reading through fetch().
          buffer = buffer.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const frames = buffer.split(/\n\n+/);
          if (!force) {
            buffer = frames.pop() || '';
            return frames;
          }
          buffer = '';
          return frames.filter((frame) => frame.trim().length > 0);
        }

        function handleFrame(frame) {
          const lines = frame.split('\n');
          const eventLine = lines.find((line) => line.startsWith('event:'));
          const dataLines = lines
            .filter((line) => line.startsWith('data:'))
            .map((line) => line.slice(5).trimStart());
          if (!dataLines.length) return;
          firstFrameSeen = true;
          streamFrameCount += 1;
          window.clearTimeout(stalledTimer);
          const eventName = eventLine ? eventLine.slice(6).trim() : 'data';
          const dataText = dataLines.join('\n');
          const payload = parsePayload(dataText);
          console.debug('[shell-app] stream frame', {
            event: eventName,
            frame: streamFrameCount,
            bytes: dataText.length,
          });
          if (eventName === 'complete') {
            renderFinalAnswer(payload.output);
          } else if (eventName === 'error') {
            appendActivity('error', payload);
            activityStatusEl.textContent = 'Run failed';
          } else {
            appendActivity(eventName, payload);
          }
        }

        try {
          const resp = await fetch('/api/chat', {
            method: 'POST',
            cache: 'no-store',
            headers: {
              'Accept': 'text/event-stream',
              'Content-Type': 'application/json',
              'X-Shell-App-Template-Version': SHELL_APP_TEMPLATE_VERSION,
            },
            body: JSON.stringify({ query }),
          });
          console.debug('[shell-app] chat response', {
            ok: resp.ok,
            status: resp.status,
            requestId: resp.headers.get('x-shell-app-request-id'),
            templateVersion: resp.headers.get('x-shell-app-template-version'),
          });
          if (!resp.ok || !resp.body) {
            appendActivity('error', { raw: 'HTTP ' + resp.status });
            activityStatusEl.textContent = 'Request failed';
            return;
          }
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { value, done } = await reader.read();
            if (done) {
              buffer += decoder.decode();
              for (const frame of drainFrames(true)) handleFrame(frame);
              break;
            }
            buffer += decoder.decode(value, { stream: true });
            for (const frame of drainFrames(false)) handleFrame(frame);
          }
        } catch (e) {
          appendActivity('error', { raw: 'Client error: ' + (e && e.message ? e.message : e) });
          activityStatusEl.textContent = 'Client error';
        } finally {
          window.clearTimeout(stalledTimer);
          console.debug('[shell-app] chat stream finished', { frames: streamFrameCount });
          sendEl.disabled = false;
        }
      }

      sendEl.addEventListener('click', sendQuery);
      qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); } });
    </script>
  </body>
</html>
